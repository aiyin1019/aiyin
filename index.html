<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>爱因</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Roboto}
body{background:#f2f2f5;margin:0;padding:0;width:100%;height:100vh;overflow:hidden}
:root{
    --chat-bg:#f5f5f5;
    --bubble-self:#95ec90;
    --bubble-self-text:#000;
    --bubble-other:#ffffff;
    --bubble-other-text:#333;
    --wx-green:#07c160;
}
.wrapper{width:100%;height:100vh;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.page{display:none;width:100%;height:100%;flex-direction:column;overflow:hidden}
.page.active{display:flex}

.wx-top-bar{height:56px;background:#f7f7f9;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 8px;position:relative;flex-shrink:0}
.wx-left-area{display:flex;align-items:center;gap:4px;position:absolute;left:8px;top:50%;transform:translateY(-50%);z-index:10}
.wx-back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;padding:0;margin:0}
.wx-back svg{width:18px;height:18px}
.status-tag{padding:11px 12px;background:#eef0f3;border-radius:8px;font-size:12px;color:#555;white-space:nowrap}
.wx-title-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:0 70px}
.wx-title{font-size:17px;font-weight:500;cursor:pointer;user-select:none}
.note-input{font-size:17px;font-weight:500;border:none;outline:none;background:transparent;text-align:center;width:100px}
.wx-top-right{display:flex;gap:14px;position:absolute;right:12px;top:50%;transform:translateY(-50%);align-items:center}
.wx-icon{cursor:pointer;color:#333;width:20px;height:20px;display:flex;align-items:center;justify-content:center}

.chat-area{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-box{flex:1;overflow-y:auto;padding:12px;background:var(--chat-bg);min-height:0;display:flex;flex-direction:column}
.msg-row{display:flex;align-items:flex-start;gap:8px;margin:4px 0;width:100%}
.msg-row-left{justify-content:flex-start}
.msg-row-right{justify-content:flex-end}
.msg-avatar{width:40px;height:40px;border-radius:6px;background:#ccc;flex-shrink:0;cursor:pointer;background-size:cover;background-position:center}
.msg-avatar-hidden{visibility:hidden}
.msg-content{display:flex;flex-direction:column;max-width:72%}
.msg-bubble{padding:10px 13px;border-radius:14px;font-size:14px;position:relative;word-break:break-word}
.msg-left .msg-bubble{background:var(--bubble-other);color:var(--bubble-other-text)}
.msg-right .msg-bubble{background:var(--bubble-self);color:var(--bubble-self-text)}
.msg-img{max-width:180px;border-radius:12px;margin:8px 0;display:block}
.msg-status{font-size:10px;color:#999;margin-top:2px}
.msg-left .msg-status{text-align:left;padding-left:4px}
.msg-right .msg-status{text-align:right;padding-right:4px}
.msg-right .msg-status .read-mark{color:#07c160}
.msg-time-divider{text-align:center;font-size:12px;color:#999;margin:12px 0}

.chat-input-wrap{border-top:1px solid #eee;padding:8px 10px;background:#fff;display:flex;gap:10px;align-items:center;flex-shrink:0}
.btn-voice,.btn-face,.btn-more{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#444;background:transparent;border:none}
.btn-voice svg,.btn-face svg,.btn-more svg{width:22px;height:22px}
.chat-input{flex:1;height:42px;border:1px solid #ddd;border-radius:8px;padding:0 12px;font-size:15px;outline:none}
.voice-hold-btn{flex:1;height:42px;border:1px solid #ddd;border-radius:8px;background:#f5f5f5;display:none;align-items:center;justify-content:center;font-size:15px;color:#333;cursor:pointer;user-select:none}

.emoji-panel{background:#fff;border-top:1px solid #eee;display:none;flex-direction:column;flex-shrink:0}
.emoji-top-tabs{display:flex;padding:8px 12px;gap:8px;border-bottom:1px solid #eee}
.emoji-top-tab{height:36px;padding:0 12px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#666;cursor:pointer;border-radius:18px;background:#f5f5f5}
.emoji-top-tab.active{background:#07c160;color:#fff}
.emoji-content-area{height:140px;overflow:hidden}
.emoji-grid-emoji{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px;height:100%;overflow-y:auto}
.emoji-grid-emoji .emoji-item{text-align:center;cursor:pointer;padding:6px;font-size:20px}
.emoji-grid-kaomoji{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;height:100%;overflow-y:auto}
.emoji-grid-kaomoji .emoji-item{border:1px solid #e2e2e2;border-radius:6px;padding:6px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer}
.emoji-grid-img{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;height:100%;overflow-y:auto}
.img-sticker-item{border:1px solid #e2e2e2;border-radius:8px;overflow:hidden;cursor:pointer}
.img-sticker-item img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.bottom-bar{display:flex;gap:8px;padding:8px 12px;border-top:1px solid #eee}
.kaomoji-input{flex:1;padding:10px 12px;border:1px solid #ddd;border-radius:20px;font-size:14px;outline:none}
.add-text-btn{padding:10px 16px;border:none;border-radius:20px;background:#07c160;color:#fff;font-size:14px;cursor:pointer}
.add-sticker-btn{width:52px;height:52px;border:1px dashed #ccc;border-radius:8px;background:#f7f7f7;color:#999;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.file-input-hide{display:none}

.tab-bar{height:60px;background:#fff;display:flex;border-top:1px solid #e5e5e5;flex-shrink:0}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:11px;color:#666;position:relative}
.tab-item.active{color:var(--wx-green)}
.red-dot{position:absolute;top:8px;right:50%;margin-right:-14px;width:8px;height:8px;background:#f53737;border-radius:50%;display:none}

.chat-list-page{background:#fff;overflow-y:auto;flex:1}
.chat-list-item{display:flex;align-items:center;padding:12px;border-bottom:1px solid #eee;cursor:pointer;position:relative}
.chat-list-avatar{width:48px;height:48px;border-radius:6px;background:#ccc;margin-right:12px;cursor:pointer;background-size:cover;background-position:center}
.chat-list-info{flex:1}
.chat-list-name{font-size:16px;font-weight:500}
.chat-list-desc{font-size:13px;color:#999;margin-top:3px}
.chat-list-time{font-size:12px;color:#999}

.contact-page{background:#f5f5f5;overflow-y:auto;flex:1}
.contact-group{background:#fff;margin-bottom:8px}
.contact-group-title{padding:6px 12px;background:#f2f2f5;font-size:13px;color:#666}
.contact-item{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer}
.contact-avatar{width:42px;height:42px;border-radius:6px;background:#ccc;margin-right:12px;cursor:pointer;background-size:cover;background-position:center}
.contact-name{font-size:15px}

.moment-page{background:#f5f5f5;overflow-y:auto;flex:1}
.moment-header{height:220px;background:#999;position:relative;background-size:cover;background-position:center;cursor:pointer}
.moment-header-top-camera{position:absolute;top:12px;right:16px;width:24px;height:24px;color:#fff;cursor:pointer;z-index:6}
.moment-avatar{width:70px;height:70px;border-radius:50%;border:2px solid #fff;position:absolute;bottom:-35px;right:16px;background:#ccc;cursor:pointer;z-index:4;background-size:cover;background-position:center}
.moment-name{position:absolute;bottom:15px;right:100px;color:#fff;font-size:17px;font-weight:600;z-index:5;text-shadow:0 1px 3px rgba(0,0,0,0.5)}
.moment-list{padding:44px 12px 20px}
.moment-item{background:#fff;margin-bottom:8px;padding:12px;border-radius:10px}
.moment-avatar-small{width:40px;height:40px;border-radius:50%;background:#ccc;float:left;margin-right:10px;background-size:cover;background-position:center}
.moment-name-small{font-size:15px;color:#333;font-weight:500}
.moment-time{font-size:12px;color:#999;margin-top:2px}
.moment-text{margin-top:8px;font-size:14px;line-height:1.5}
.moment-actions{display:flex;justify-content:flex-end;gap:16px;margin-top:8px}
.moment-actions .action-btn{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;color:#666;border:none;background:none}
.moment-actions .action-btn.liked{color:#e64340}
.comment-box{margin-top:8px;padding:8px;background:#f5f5f5;border-radius:6px;font-size:13px}
.comment-box .comment-item{margin:4px 0}
.comment-box .comment-reply{color:#576b95;cursor:pointer;margin-left:8px}

.text-moment-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:999;display:none;flex-direction:column;padding:16px}
.text-moment-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.text-moment-cancel{font-size:16px;color:#666;cursor:pointer}
.text-moment-title{font-size:17px;font-weight:500}
.text-moment-send{color:var(--wx-green);font-size:16px;cursor:pointer}
.text-moment-input{flex:1;width:100%;border:none;outline:none;font-size:16px;resize:none}

.cover-preview-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;justify-content:center;align-items:center}
.cover-preview-img{max-width:90%;max-height:90%;object-fit:contain}
.cover-change-btn{position:absolute;bottom:40px;right:24px;width:36px;height:36px;background:rgba(255,255,255,0.65);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#333;cursor:pointer}
.file-input{display:none}

.plus-menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px}
.plus-menu-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.plus-menu-icon{width:56px;height:56px;border-radius:12px;background:#f5f5f5;display:flex;align-items:center;justify-content:center}
.plus-menu-icon i{font-size:24px;color:#333}
.plus-menu-label{font-size:12px;color:#333}

.redpack-msg{width:220px;background:#e63923;border-radius:8px;color:#fff;padding:14px 12px;cursor:pointer}
.redpack-msg .rp-amount{font-size:20px;font-weight:500;margin-bottom:4px}
.redpack-msg .rp-desc{font-size:13px;opacity:0.9}
.redpack-msg .rp-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px}

.transfer-msg{width:220px;background:#ffb340;border-radius:8px;color:#fff;padding:14px 12px;cursor:pointer}
.transfer-msg .tf-amount{font-size:20px;font-weight:500;margin-bottom:4px}
.transfer-msg .tf-desc{font-size:13px;opacity:0.9}
.transfer-msg .tf-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px}

.gift-msg{width:220px;background:#2563eb;border-radius:8px;color:#fff;padding:14px 12px}
.gift-msg .gift-title{font-size:16px;font-weight:500;margin-bottom:4px}
.gift-msg .gift-desc{font-size:13px;opacity:0.9}

.music-msg{width:240px;background:#f7f7f7;border-radius:8px;padding:12px;display:flex;gap:10px;color:#222}
.music-cover{width:50px;height:50px;border-radius:6px;background:#ccc;flex-shrink:0}
.music-info{flex:1;display:flex;flex-direction:column;justify-content:center}
.music-song{font-size:14px;font-weight:500}
.music-singer{font-size:12px;color:#666;margin-top:2px}

.modal-mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9996}
.modal-panel{display:none;position:fixed;bottom:0;left:0;width:100%;background:#fff;border-radius:16px 16px 0 0;z-index:9997;padding:20px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:17px;font-weight:500}
.modal-close{font-size:18px;color:#999;cursor:pointer}
.modal-input{width:100%;padding:14px 12px;border:1px solid #eee;border-radius:10px;font-size:15px;outline:none;margin-bottom:16px}
.modal-btn{width:100%;height:48px;border:none;border-radius:8px;font-size:16px;cursor:pointer;color:#fff}

.call-float{display:none;position:fixed;top:80px;right:16px;width:100px;border-radius:12px;z-index:9999;overflow:hidden;cursor:move;background-size:cover;background-position:center;background-color:#333}
.call-float-content{background:rgba(0,0,0,0.6);padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff}
.call-float-avatar{width:40px;height:40px;border-radius:50%;background:#666;overflow:hidden}
.call-float-status{font-size:11px;color:#ccc}
.call-hangup-btn{width:36px;height:36px;border-radius:50%;background:#f53f3f;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>
</head>
<body>
<div class="wrapper">
    <div id="pageChatDetail" class="page active">
        <div class="wx-top-bar">
            <div class="wx-left-area">
                <div class="wx-back" id="btnBack">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </div>
                <div class="status-tag">在看海</div>
            </div>
            <div class="wx-title-wrap"><div class="wx-title" id="noteTitle">梦角</div></div>
            <div class="wx-top-right">
                <span class="wx-icon" onclick="alert('手机')">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                </span>
                <span class="wx-icon" onclick="alert('设置')">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </span>
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-box" id="chatBox"></div>
            <div class="emoji-panel" id="emojiPanel">
                <div class="emoji-top-tabs">
                    <div class="emoji-top-tab active" data-type="emoji">emoji</div>
                    <div class="emoji-top-tab" data-type="kaomoji">颜文字</div>
                    <div class="emoji-top-tab" data-type="img">表情包</div>
                </div>
                <div class="emoji-content-area">
                    <div class="emoji-grid-emoji" id="emojiGridEmoji"></div>
                    <div class="emoji-grid-kaomoji" id="emojiGridKaomoji" style="display:none"></div>
                    <div class="emoji-grid-img" id="emojiGridImg" style="display:none"></div>
                </div>
                <div class="bottom-bar" id="barKaomoji">
                    <input class="kaomoji-input" id="newKaomojiInput" placeholder="添加颜文字">
                    <button class="add-text-btn" onclick="addKaomojiText()">添加</button>
                </div>
                <div class="bottom-bar" id="barImg" style="display:none">
                    <div class="add-sticker-btn" onclick="document.getElementById('fileSticker').click()">+</div>
                    <input type="file" id="fileSticker" class="file-input-hide" accept="image/*" multiple>
                </div>
            </div>
            <div class="chat-input-wrap">
                <div class="btn-voice" id="btnVoice" onclick="toggleVoiceInput()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </div>
                <input type="text" class="chat-input" id="chatInput" placeholder="输入消息">
                <div class="voice-hold-btn" id="voiceHoldBtn" ontouchstart="startVoice()" ontouchend="endVoice()">按住说话</div>
                <div class="btn-face" id="btnFace">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                </div>
                <div class="btn-more" onclick="showPlusMenu()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </div>
            </div>
        </div>
    </div>

    <div id="pageChatList" class="page">
        <div style="height:56px;background:#f7f7f9;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;">
            <span style="font-size:17px;font-weight:500;">微信</span>
            <span style="position:absolute;right:16px;cursor:pointer;" onclick="showAddMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </span>
        </div>
        <div class="chat-list-page">
            <div class="chat-list-item" id="goToChat">
                <div class="chat-list-avatar" id="listAvatar"></div>
                <div class="chat-list-info">
                    <div class="chat-list-name" id="listName">梦角</div>
                    <div class="chat-list-desc">点击进入聊天</div>
                </div>
                <div class="chat-list-time">今天</div>
            </div>
        </div>
    </div>

    <div id="pageContact" class="page">
        <div style="height:56px;background:#f7f7f9;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <span style="font-size:17px;font-weight:500;">联系人</span>
        </div>
        <div class="contact-page">
            <div class="contact-group">
                <div class="contact-group-title">朋友</div>
                <div class="contact-item">
                    <div class="contact-avatar"></div>
                    <div class="contact-name" id="contactName">梦角</div>
                </div>
            </div>
        </div>
    </div>

    <div id="pageMoment" class="page">
        <div style="height:56px;background:#f7f7f9;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <span style="font-size:17px;font-weight:500;">发现</span>
        </div>
        <div class="moment-page">
            <div class="moment-header" id="momentCover">
                <div class="moment-header-top-camera" id="momentHeaderTopCamera">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </div>
                <div class="moment-avatar" id="momentMyAvatar"></div>
                <div class="moment-name">我</div>
            </div>
            <div class="moment-list" id="momentList"></div>
        </div>
    </div>

    <div class="tab-bar" id="tabBar">
        <div class="tab-item active" data-tab="chatList">

                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.574 2.81.7A2 2 0 0 1 22 16.92z"/></svg>

<script>
let lastMsgIsMe = null;
let lastMsgTime = null;
let avatarConfig = { myAvatar: '', otherAvatar: '' };
let kaomojiList = ['(๑•̀ㅂ•́)و✧','(≧∇≦)ﾉ','(｡•́︿•̀｡)','ヽ(✿ﾟ▽ﾟ)ノ','(>﹏<)','( ´･ᴗ･` )'];
let stickerList = [];
let friends = [{id:1, name:'梦角', avatar:''}];
const emojiList = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😜','😝','😛','🤑','😎','🤓','🧐','😏','😒','🙄','😮','😯','😲','😳','🥺','😦','😧','😨','😰','😥','😢','😭','😱','😖','😣','😞','😓','😩','😫','🥱','😴','❤️','🧡','💛','💚','💙','💜','🤍','🤎','🖤','💔','❣️','💕','💞','💓','💗','💖','💘','💝','💟','💌','💋','💍','💎','🔥','💯','✨','💫','⭐','🌟','💥','💢','💦','💨','💤','💬','💭','💮','🪷','🌸','🌺','🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🙈','🙉','🙊','🐔','🐧','🐦','🐤','🦆','🦅','🦉','🦇','🐺','🐗','🐴','🦄'];

const pages = { chatDetail: document.getElementById('pageChatDetail'), chatList: document.getElementById('pageChatList'), contact: document.getElementById('pageContact'), moment: document.getElementById('pageMoment') };
function showPage(id) { Object.values(pages).forEach(p => p.classList.remove('active')); pages[id].classList.add('active'); document.getElementById('tabBar').style.display = (id === 'chatDetail') ? 'none' : 'flex'; }
showPage('chatDetail');

const tabBar = document.getElementById('tabBar');
const tabItems = tabBar.querySelectorAll('.tab-item');
tabItems.forEach(tab => { tab.onclick = () => { tabItems.forEach(t => t.classList.remove('active')); tab.classList.add('active'); const name = tab.dataset.tab; if (name === 'chatList') showPage('chatList'); if (name === 'contact') showPage('contact'); if (name === 'moment') showPage('moment'); }; });
document.getElementById('btnBack').onclick = () => { showPage('chatList'); tabItems.forEach(t => t.classList.remove('active')); tabItems[0].classList.add('active'); };
document.getElementById('goToChat').onclick = () => { showPage('chatDetail'); tabItems.forEach(t => t.classList.remove('active')); tabItems[0].classList.add('active'); };

document.getElementById('noteTitle').onclick = function() {
    const old = this.innerText;
    const input = document.createElement('input');
    input.className = 'note-input';
    input.value = old;
    this.innerHTML = '';
    this.appendChild(input);
    input.focus();
    input.onblur = () => { const val = input.value.trim() || old; this.innerText = val; document.getElementById('listName').textContent = val; document.getElementById('contactName').textContent = val; };
    input.onkeydown = (e) => { if (e.key === 'Enter') input.blur(); };
};

const chatBox = document.getElementById('chatBox');
const chatInput = document.getElementById('chatInput');
const emojiPanel = document.getElementById('emojiPanel');
const btnFace = document.getElementById('btnFace');
const gridEmoji = document.getElementById('emojiGridEmoji');
const gridKaomoji = document.getElementById('emojiGridKaomoji');
const gridImg = document.getElementById('emojiGridImg');
const barKaomoji = document.getElementById('barKaomoji');
const barImg = document.getElementById('barImg');
const fileSticker = document.getElementById('fileSticker');

function getNowTime() { const d = new Date(); return `${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`; }
function getNowMinutes() { const d = new Date(); return `${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`; }
function renderEmoji() { gridEmoji.innerHTML = ''; emojiList.forEach(e => { const div = document.createElement('div'); div.className = 'emoji-item'; div.textContent = e; div.onclick = () => { chatInput.value += e; }; gridEmoji.appendChild(div); }); }
function renderKaomoji() { gridKaomoji.innerHTML = ''; kaomojiList.forEach(text => { const div = document.createElement('div'); div.className = 'emoji-item'; div.textContent = text; div.onclick = () => { chatInput.value += text; }; gridKaomoji.appendChild(div); }); }
function renderStickers() { gridImg.innerHTML = ''; stickerList.forEach(src => { const wrap = document.createElement('div'); wrap.className = 'img-sticker-item'; const img = document.createElement('img'); img.src = src; wrap.appendChild(img); wrap.onclick = () => sendImageMsg(src); gridImg.appendChild(wrap); }); }
function addKaomojiText() { const input = document.getElementById('newKaomojiInput'); const val = input.value.trim(); if (!val) return; kaomojiList.push(val); input.value = ''; renderKaomoji(); }
fileSticker.onchange = function(e) { const files = e.target.files; for (let i = 0; i < files.length; i++) { const reader = new FileReader(); reader.onload = ev => { stickerList.push(ev.target.result); renderStickers(); }; reader.readAsDataURL(files[i]); } fileSticker.value = ''; };
document.querySelectorAll('.emoji-top-tab').forEach(tab => { tab.onclick = function() { document.querySelectorAll('.emoji-top-tab').forEach(t => t.classList.remove('active')); this.classList.add('active'); const type = this.dataset.type; gridEmoji.style.display = 'none'; gridKaomoji.style.display = 'none'; gridImg.style.display = 'none'; barKaomoji.style.display = 'none'; barImg.style.display = 'none'; if (type === 'emoji') gridEmoji.style.display = 'grid'; if (type === 'kaomoji') { gridKaomoji.style.display = 'grid'; barKaomoji.style.display = 'flex'; } if (type === 'img') { gridImg.style.display = 'grid'; barImg.style.display = 'flex'; } }; });
btnFace.onclick = () => { emojiPanel.style.display = emojiPanel.style.display === 'flex' ? 'none' : 'flex'; };
document.addEventListener('click', e => { if (!emojiPanel.contains(e.target) && !btnFace.contains(e.target)) emojiPanel.style.display = 'none'; });

function checkTimeDivider() {
    const now = new Date();
    const nowMinutes = `${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`;
    if (lastMsgTime && lastMsgTime !== nowMinutes) {
        const divider = document.createElement('div');
        divider.className = 'msg-time-divider';
        divider.innerText = nowMinutes;
        chatBox.appendChild(divider);
    }
    lastMsgTime = nowMinutes;
}

function showTypingOnTitle() {
    const title = document.getElementById('noteTitle');
    const original = title.innerText;
    title.innerText = '输入中...';
    setTimeout(() => { title.innerText = original; }, 2000);
}

function addBubble(text, isMe, imgSrc = null) {
    checkTimeDivider();
    const showAvatar = (lastMsgIsMe !== isMe);
    lastMsgIsMe = isMe;
    const row = document.createElement('div');
    row.className = `msg-row ${isMe ? 'msg-row-right' : 'msg-row-left'}`;
    const avatar = document.createElement('div');
    const avatarSrc = isMe ? avatarConfig.myAvatar : avatarConfig.otherAvatar;
    avatar.className = `msg-avatar ${showAvatar ? '' : 'msg-avatar-hidden'}`;
    avatar.style.background = avatarSrc ? `url(${avatarSrc})` : '#ccc';
    avatar.onclick = e => { e.stopPropagation(); changeAvatar(isMe); };
    avatar.ondblclick = e => { e.stopPropagation(); triggerPatPat(isMe); };
    const content = document.createElement('div');
    content.className = 'msg-content';
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    if (imgSrc) { const img = document.createElement('img'); img.className = 'msg-img'; img.src = imgSrc; bubble.appendChild(img); } else { bubble.innerText = text; }
    const status = document.createElement('div');
    status.className = 'msg-status';
    if (isMe) { const isRead = Math.random() > 0.05; if (isRead) status.innerHTML = `<span class="read-mark">已读</span> ${getNowTime()}`; else status.innerText = getNowTime(); }
    else status.innerText = getNowTime();
    content.appendChild(bubble);
    content.appendChild(status);
    if (isMe) { row.appendChild(content); row.appendChild(avatar); } else { row.appendChild(avatar); row.appendChild(content); }
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function sendMsg() {
    const text = chatInput.value.trim();
    if (!text) return;
    addBubble(text, true);
    chatInput.value = '';
    showTypingOnTitle();
    setTimeout(() => {
        if (Math.random() < 0.1) { addBubble('对方撤回了一条消息', false); }
        else { addBubble('收到啦🥰', false); }
    }, 1500);
}
function sendImageMsg(imgSrc) { addBubble('', true, imgSrc); showTypingOnTitle(); setTimeout(() => { addBubble('这个图片好可爱✨', false); }, 1500); }
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });

function changeAvatar(isMe) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = ev => {
                if (isMe) avatarConfig.myAvatar = ev.target.result;
                else { avatarConfig.otherAvatar = ev.target.result; document.getElementById('listAvatar').style.background = `url(${ev.target.result})`; }
                alert('头像已更换！');
            };
            reader.readAsDataURL(file);
        }
    };
    input.click();
}

function triggerPatPat(isMe) { if (isMe) alert('你拍了拍自己'); else alert('你拍了拍梦角'); }

let isVoiceMode = false;
function toggleVoiceInput() {
    isVoiceMode = !isVoiceMode;
    const input = document.getElementById('chatInput');
    const voiceBtn = document.getElementById('voiceHoldBtn');
    if (isVoiceMode) { input.style.display = 'none'; voiceBtn.style.display = 'flex'; }
    else { input.style.display = 'block'; voiceBtn.style.display = 'none'; }
}
function startVoice() { document.getElementById('voiceHoldBtn').textContent = '松开结束'; }
function endVoice() {
    document.getElementById('voiceHoldBtn').textContent = '按住说话';
    addBubble('🎤 语音消息', true);
    showTypingOnTitle();
    setTimeout(() => { addBubble('收到啦🥰', false); }, 1500);
}

function showPlusMenu() {
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:999;display:flex;align-items:flex-end;';
    modal.innerHTML = `<div style="width:100%;background:#fff;border-radius:20px 20px 0 0;padding:20px;"><div class="plus-menu-grid">
        <div class="plus-menu-item" onclick="showModal('redpacketModal')"><div class="plus-menu-icon"><i class="fa fa-envelope-o"></i></div><div class="plus-menu-label">红包</div></div>
        <div class="plus-menu-item" onclick="showModal('transferModal')"><div class="plus-menu-icon"><i class="fa fa-money"></i></div><div class="plus-menu-label">转账</div></div>
        <div class="plus-menu-item" onclick="this.closest('div[style]').parentElement.remove();addGiftMsg()"><div class="plus-menu-icon"><i class="fa fa-gift"></i></div><div class="plus-menu-label">礼物</div></div>
        <div class="plus-menu-item" onclick="this.closest('div[style]').parentElement.remove();addMusicMsg()"><div class="plus-menu-icon"><i class="fa fa-music"></i></div><div class="plus-menu-label">音乐</div></div>
        <div class="plus-menu-item" onclick="this.closest('div[style]').parentElement.remove();startCall()"><div class="plus-menu-icon"><i class="fa fa-video-camera"></i></div><div class="plus-menu-label">视频</div></div>
        <div class="plus-menu-item" onclick="this.closest('div[style]').parentElement.remove();startCall()"><div class="plus-menu-icon"><i class="fa fa-phone"></i></div><div class="plus-menu-label">语音</div></div>
    </div></div>`;
    document.body.appendChild(modal);
    modal.onclick = e => { if (e.target === modal) modal.remove(); };
}

function showModal(id) { document.getElementById('modalMask').style.display = 'block'; document.getElementById(id).style.display = 'block'; }
function closeModal(id) { document.getElementById('modalMask').style.display = 'none'; document.getElementById(id).style.display = 'none'; }
document.getElementById('modalMask').onclick = () => { document.getElementById('modalMask').style.display = 'none'; document.querySelectorAll('.modal-panel').forEach(p => p.style.display = 'none'); };

function sendRedpacket() {
    const money = document.getElementById('rpMoney').value.trim();
    const remark = document.getElementById('rpRemark').value.trim() || '恭喜发财';
    if (!money) return alert('请输入金额');
    addRedpackMsg(money, remark);
    closeModal('redpacketModal');
    document.getElementById('rpMoney').value = '';
    document.getElementById('rpRemark').value = '';
}
function sendTransfer() {
    const money = document.getElementById('tfMoney').value.trim();
    if (!money) return alert('请输入金额');
    addTransferMsg(money);
    closeModal('transferModal');
    document.getElementById('tfMoney').value = '';
}

function addRedpackMsg(money, remark) {
    const row = document.createElement('div');
    row.className = 'msg-row msg-row-right';
    row.innerHTML = `<div class="msg-content"><div class="msg-bubble msg-right"><div class="redpack-msg" onclick="openRedpacket(this,'${money}','${remark}')"><div class="rp-amount">¥${money}</div><div class="rp-desc">${remark}</div><div class="rp-footer"><span>你发了一个红包</span></div></div></div><div class="msg-status"><span class="read-mark">已读</span> ${getNowTime()}</div></div><div class="msg-avatar" style="background:${avatarConfig.myAvatar ? `url(${avatarConfig.myAvatar})` : '#ccc'};background-size:cover"></div>`;
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function openRedpacket(element, money, remark) {
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;';
    modal.innerHTML = `<div style="width:280px;background:#e63923;border-radius:16px;overflow:hidden;text-align:center;"><div style="padding:40px 20px 30px;background:linear-gradient(180deg,#f5553c,#e63923);"><div style="color:#fdd835;font-size:14px;margin-bottom:20px;">${remark}</div><div style="width:80px;height:80px;border-radius:50%;background:#fdd835;margin:0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:28px;color:#e63923;font-weight:bold;" onclick="receiveRedpacket(this,'${money}')">開</div><div style="color:#fff;font-size:12px;margin-top:20px;">梦角发来的红包</div></div><div style="background:#fff;padding:16px;font-size:13px;color:#999;" onclick="this.closest('div[style]').remove()">关闭</div></div>`;
    document.body.appendChild(modal);
    modal.onclick = e => { if (e.target === modal) modal.remove(); };
}

function receiveRedpacket(btn, money) {
    const amount = (Math.random() * parseFloat(money)).toFixed(2);
    btn.parentElement.innerHTML = `<div style="color:#fdd835;font-size:14px;margin-bottom:10px;">已领取</div><div style="color:#fff;font-size:36px;font-weight:bold;">¥${amount}</div><div style="color:#fdd835;font-size:12px;margin-top:10px;">已存入零钱</div>`;
}

function addTransferMsg(money) {
    const row = document.createElement('div');
    row.className = 'msg-row msg-row-right';
    row.innerHTML = `<div class="msg-content"><div class="msg-bubble msg-right"><div class="transfer-msg" onclick="confirmTransfer(this,'${money}')"><div class="tf-amount">¥${money}</div><div class="tf-desc">转账</div><div class="tf-footer"><span>你发起了一笔转账</span></div></div></div><div class="msg-status"><span class="read-mark">已读</span> ${getNowTime()}</div></div><div class="msg-avatar" style="background:${avatarConfig.myAvatar ? `url(${avatarConfig.myAvatar})` : '#ccc'};background-size:cover"></div>`;
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function confirmTransfer(element, money) {
    element.querySelector('.tf-footer').innerHTML = '<span>已收款</span>';
    const tip = document.createElement('div');
    tip.className = 'msg-time-divider';
    tip.innerText = '梦角已收款 ¥' + money;
    chatBox.appendChild(tip);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function addGiftMsg() {
    const row = document.createElement('div');
    row.className = 'msg-row msg-row-right';
    row.innerHTML = `<div class="msg-content"><div class="msg-bubble msg-right"><div class="gift-msg"><div class="gift-title">送你一份小礼物🎁</div><div class="gift-desc">一份心意</div></div></div><div class="msg-status"><span class="read-mark">已读</span> ${getNowTime()}</div></div><div class="msg-avatar" style="background:${avatarConfig.myAvatar ? `url(${avatarConfig.myAvatar})` : '#ccc'};background-size:cover"></div>`;
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function addMusicMsg() {
    const row = document.createElement('div');
    row.className = 'msg-row msg-row-right';
    row.innerHTML = `<div class="msg-content"><div class="msg-bubble msg-right"><div class="music-msg"><div class="music-cover"></div><div class="music-info"><div class="music-song">示例歌曲</div><div class="music-singer">歌手名字</div></div></div></div><div class="msg-status"><span class="read-mark">已读</span> ${getNowTime()}</div></div><div class="msg-avatar" style="background:${avatarConfig.myAvatar ? `url(${avatarConfig.myAvatar})` : '#ccc'};background-size:cover"></div>`;
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function startCall() {
    const callFloat = document.getElementById('callFloat');
    callFloat.style.display = 'block';
    document.getElementById('callStatus').textContent = '正在呼叫...';
    setTimeout(() => {
        if (Math.random() < 0.6) { document.getElementById('callStatus').textContent = '对方无法接听'; setTimeout(() => { callFloat.style.display = 'none'; }, 2000); }
        else { document.getElementById('callStatus').textContent = '通话中'; }
    }, 2000);
}
function endCall() { document.getElementById('callFloat').style.display = 'none'; }

function showAddMenu() {
    const menu = document.createElement('div');
    menu.style.cssText = 'position:fixed;top:60px;right:16px;background:#fff;border-radius:12px;box-shadow:0 2px 20px rgba(0,0,0,0.15);z-index:999;overflow:hidden;min-width:140px;';
    menu.innerHTML = '<div style="padding:12px 16px;cursor:pointer;" onclick="alert(\'创建群聊\');this.parentElement.remove()">👥 创建群聊</div><div style="padding:12px 16px;cursor:pointer;border-top:1px solid #eee;" onclick="alert(\'添加联系人\');this.parentElement.remove()">➕ 添加联系人</div>';
    document.body.appendChild(menu);
    setTimeout(() => { document.addEventListener('click', function close(e) { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', close); } }); }, 100);
}

const chatListItem = document.getElementById('goToChat');
let longPressTimer = null;
chatListItem.addEventListener('touchstart', e => { longPressTimer = setTimeout(() => { const nameEl = document.getElementById('listName'); if (nameEl.textContent.includes('置顶')) { nameEl.textContent = '梦角'; alert('已取消置顶'); } else { nameEl.textContent = '梦角 📌置顶'; alert('已置顶'); } }, 500); });
chatListItem.addEventListener('touchend', () => clearTimeout(longPressTimer));
chatListItem.addEventListener('touchmove', () => clearTimeout(longPressTimer));

let startX = 0, startY = 0;
chatListItem.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; });
chatListItem.addEventListener('touchend', e => { const diffX = e.changedTouches[0].clientX - startX; const diffY = e.changedTouches[0].clientY - startY; if (Math.abs(diffX) > 80 && Math.abs(diffX) > Math.abs(diffY) && diffX < 0) { if (confirm('删除该聊天？')) { chatListItem.remove(); alert('已删除'); } } });

const momentCover = document.getElementById('momentCover');
const coverPreviewModal = document.getElementById('coverPreviewModal');
const coverPreviewImg = document.getElementById('coverPreviewImg');
momentCover.onclick = e => { if (e.target.closest('.moment-header-top-camera')) return; coverPreviewImg.src = getComputedStyle(momentCover).backgroundImage.match(/url\("?(.*?)"?\)/)?.[1] || ''; coverPreviewModal.style.display = 'flex'; };
coverPreviewModal.onclick = e => { if (e.target === coverPreviewModal) coverPreviewModal.style.display = 'none'; };
document.getElementById('coverChangeBtn').onclick = () => document.getElementById('fileInputCover').click();
document.getElementById('fileInputCover').onchange = function(e) { if (e.target.files[0]) { momentCover.style.backgroundImage = `url(${URL.createObjectURL(e.target.files[0])})`; coverPreviewModal.style.display = 'none'; } };

const headerTopCamera = document.getElementById('momentHeaderTopCamera');
let pressTimer = null;
headerTopCamera.addEventListener('touchstart', () => { pressTimer = setTimeout(() => { document.getElementById('textMomentModal').style.display = 'flex'; }, 600); });
headerTopCamera.addEventListener('touchend', () => { clearTimeout(pressTimer); document.getElementById('fileInputMomentPic').click(); });
headerTopCamera.addEventListener('touchmove', () => clearTimeout(pressTimer));
document.getElementById('fileInputMomentPic').onchange = function(e) { if (e.target.files[0]) addMomentItem('我', `<img src="${URL.createObjectURL(e.target.files[0])}" style="max-width:100%;border-radius:8px;margin-top:6px">`); };
document.getElementById('textMomentCancel').onclick = () => document.getElementById('textMomentModal').style.display = 'none';
document.getElementById('textMomentSend').onclick = () => { const val = document.querySelector('.text-moment-input').value.trim(); if (val) { addMomentItem('我', val); document.getElementById('textMomentModal').style.display = 'none'; document.querySelector('.text-moment-input').value = ''; } };

function addMomentItem(name, content) {
    const div = document.createElement('div');
    div.className = 'moment-item';
    div.innerHTML = `<div class="moment-avatar-small"></div><div class="moment-name-small">${name}</div><div class="moment-time">刚刚</div><div class="moment-text">${content}</div><div class="moment-actions"><button class="action-btn" onclick="this.classList.toggle('liked')">❤️ <span>点赞</span></button><button class="action-btn" onclick="commentMoment(this)">💬 <span>评论</span></button></div><div class="comment-box" style="display:none"></div>`;
    document.getElementById('momentList').prepend(div);
    if (Math.random() < 0.5) {
        setTimeout(() => {
            const commentBox = div.querySelector('.comment-box');
            commentBox.style.display = 'block';
            commentBox.innerHTML = `<div class="comment-item"><strong>梦角</strong>：${kaomojiList[Math.floor(Math.random()*kaomojiList.length)]}<span class="comment-reply" onclick="replyComment(this)">回复</span></div>`;
            document.getElementById('momentRedDot').style.display = 'block';
        }, 2000);
    }
    if (Math.random() < 0.5) {
        setTimeout(() => {
            const autoDiv = document.createElement('div');
            autoDiv.className = 'moment-item';
            autoDiv.innerHTML = `<div class="moment-avatar-small"></div><div class="moment-name-small">梦角</div><div class="moment-time">刚刚</div><div class="moment-text">${kaomojiList[Math.floor(Math.random()*kaomojiList.length)]}</div><div class="moment-actions"><button class="action-btn" onclick="this.classList.toggle('liked')">❤️ <span>点赞</span></button><button class="action-btn" onclick="commentMoment(this)">💬 <span>评论</span></button></div><div class="comment-box" style="display:none"></div>`;
            document.getElementById('momentList').prepend(autoDiv);
            document.getElementById('momentRedDot').style.display = 'block';
        }, 5000);
    }
}

function commentMoment(btn) {
    const commentBox = btn.closest('.moment-item').querySelector('.comment-box');
    commentBox.style.display = 'block';
    const input = document.createElement('input');
    input.style.cssText = 'width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:4px;';
    input.placeholder = '写评论...';
    input.onkeydown = e => {
        if (e.key === 'Enter' && input.value.trim()) {
            commentBox.innerHTML += `<div class="comment-item"><strong>我</strong>：${input.value}</div>`;
            input.remove();
        }
    };
    commentBox.appendChild(input);
    input.focus();
}

function replyComment(span) {
    const commentBox = span.closest('.comment-box');
    const input = document.createElement('input');
    input.style.cssText = 'width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:4px;';
    input.placeholder = '回复...';
    input.onkeydown = e => {
        if (e.key === 'Enter' && input.value.trim()) {
            commentBox.innerHTML += `<div class="comment-item"><strong>我</strong> 回复 <strong>梦角</strong>：${input.value}</div>`;
            input.remove();
        }
    };
    commentBox.appendChild(input);
    input.focus();
}

renderEmoji(); renderKaomoji(); renderStickers();

// 对方主动打电话（5%概率）
setInterval(() => {
    if (Math.random() < 0.05 && document.getElementById('callFloat').style.display !== 'block') {
        startCall();
    }
}, 30000);
</script>
