<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>微信</title>
    <style>
        :root {
            --bg: #ededed;
            --panel: #f7f7f7;
            --white: #ffffff;
            --green: #07c160;
            --green-dark: #06ad56;
            --text: #1a1a1a;
            --gray: #888;
            --light-gray: #e0e0e0;
            --bubble-in: #95ec69;
            --bubble-out: #ffffff;
            --border: #e0e0e0;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 16px;
            --chat-bg: #ededed;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }
        .phone {
            width: 390px;
            height: 844px;
            background: var(--bg);
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c2c2c;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #444;
        }
        .status-bar {
            background: var(--panel);
            padding: 14px 20px 6px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            color: #000;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }
        .app-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }
        .bottom-nav {
            display: flex;
            background: #f7f7f7;
            border-top: 1px solid #ccc;
            padding: 8px 0 6px;
            flex-shrink: 0;
        }
        .nav-item {
            flex: 1;
            text-align: center;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-item.active {
            color: var(--green);
            font-weight: 600;
        }
        .nav-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 2px;
        }
        .chat-list, .contact-list, .moments-list {
            background: var(--white);
            flex: 1;
            overflow-y: auto;
        }
        .list-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: 0.1s;
            background: white;
            position: relative;
        }
        .list-item:active { background: #f2f2f2; }
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #ddd;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
            cursor: pointer;
        }
        .item-info { flex: 1; }
        .item-title { font-size: 16px; font-weight: 500; }
        .item-message { font-size: 13px; color: #999; margin-top: 4px; }
        .item-time { font-size: 12px; color: #aaa; }
        .pinned-badge {
            background: #f0f0f0;
            color: #666;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 6px;
        }
        .chat-page {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--chat-bg);
        }
        .chat-header {
            background: #f7f7f7;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
        }
        .chat-header-left, .chat-header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .back-btn, .header-icon {
            cursor: pointer;
            font-size: 22px;
        }
        .chat-title {
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        .status-indicator {
            font-size: 11px;
            color: #999;
            display: block;
            text-align: center;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg-row {
            display: flex;
            gap: 8px;
            max-width: 80%;
        }
        .msg-row.out { align-self: flex-end; flex-direction: row-reverse; }
        .msg-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            background: var(--bubble-in);
            font-size: 15px;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .msg-row.in .msg-bubble { background: white; }
        .msg-status { font-size: 11px; color: #999; margin-top: 4px; }
        .input-bar {
            background: #f7f7f7;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #ddd;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: #333;
        }
        .input-field {
            flex: 1;
            background: white;
            border-radius: 20px;
            padding: 10px 16px;
            border: 1px solid #ddd;
            font-size: 16px;
            outline: none;
        }
        .plus-btn { font-size: 28px; }
        .emoji-panel {
            background: white;
            border-top: 1px solid #ccc;
            padding: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .emoji-tab { padding: 6px 12px; background: #f0f0f0; border-radius: 20px; cursor: pointer; }
        .emoji-item { font-size: 28px; cursor: pointer; padding: 4px; }
        .modal-backdrop {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 340px;
            max-height: 80%;
            overflow-y: auto;
        }
        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
        }
        .switch {
            width: 48px; height: 28px; background: #ccc; border-radius: 15px; position: relative;
            cursor: pointer;
        }
        .switch.on { background: var(--green); }
        .switch::after {
            content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
            background: white; border-radius: 50%; transition: 0.2s;
        }
        .switch.on::after { left: 23px; }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
        }
        .slider-row input[type="range"] {
            flex: 1;
        }
        .hidden { display: none; }
        .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #f0f0f0;
            border-radius: 12px;
            margin: 4px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn {
            padding: 10px 16px;
            background: var(--green);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .input-field-mini {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            margin: 4px 0;
        }
        .list-item-actions {
            display: flex;
            gap: 8px;
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
        }
        .phone-app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            padding: 20px;
        }
        .app-icon {
            background: white;
            border-radius: 16px;
            padding: 16px 0;
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            font-size: 14px;
        }
        .app-icon span { font-size: 28px; display: block; margin-bottom: 6px; }
        .tarot-card {
            background: #faf3e8;
            border-radius: 12px;
            padding: 16px;
            margin: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .music-player {
            background: #f0f0f0;
            border-radius: 12px;
            padding: 12px;
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .music-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ccc;
            animation: spin 4s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <div class="status-bar">
        <span>9:41</span>
        <span>📶 🔋 100%</span>
    </div>
    <div id="mainView" class="app-view"></div>
    <div class="bottom-nav" id="bottomNav">
        <div class="nav-item active" data-tab="wechat"><span class="nav-icon">💬</span>微信</div>
        <div class="nav-item" data-tab="contacts"><span class="nav-icon">👥</span>通讯录</div>
        <div class="nav-item" data-tab="moments"><span class="nav-icon">🌐</span>朋友圈</div>
    </div>
</div>
<script>
// 全局数据
let contacts = [
    { id: 1, name: '林知夏', avatar: '🌸', pinned: true, lastMsg: '今晚一起听歌吗？', time: '10:24', remark: '林知夏' }
];
let friends = [
    { id: 1, name: '林知夏', avatar: '🌸', signature: '记得听歌' }
];
let wordCards = ['我喜欢你', '今天天气真好', '一起听歌吗', '晚安', '早安', '想你了', '哈哈哈', '好呀', '嗯嗯', '在干嘛'];
let patPat = ['拍了拍你的头', '拍了拍你的肩膀', '拍了拍你的手'];
let statusList = ['✨今日好运', '🎵听歌中', '💤休息中'];
let currentChat = null;
let currentTab = 'wechat';
let messageSpeedMin = 3, messageSpeedMax = 60;
let autoReplyOn = true, autoReplyMin = 5, autoReplyMax = 30;
let readReceipt = true, allowRecall = true, allowCall = true, allowMusic = true;
let recallProbability = 10, callProbability = 3;

function getColor(id) {
    const colors = ['#7c9eb2', '#b28c7c', '#8fbc8f', '#b0a1c9', '#d4a76a', '#e8a87c', '#85cdca', '#e0a9c9'];
    return colors[id % colors.length];
}

function renderMain(tab) {
    const mainView = document.getElementById('mainView');
    if (tab === 'wechat') {
        mainView.innerHTML = `
            <div class="chat-list">
                ${contacts.map(c => `
                    <div class="list-item" data-id="${c.id}">
                        <div class="avatar" style="background:${getColor(c.id)}" onclick="event.stopPropagation();changeAvatar(${c.id})">${c.avatar}</div>
                        <div class="item-info" onclick="openChat(${c.id})">
                            <div class="item-title">${c.name} ${c.pinned ? '<span class="pinned-badge">置顶</span>' : ''}</div>
                            <div class="item-message">${c.lastMsg}</div>
                        </div>
                        <div class="item-time">${c.time}</div>
                    </div>`).join('')}
                <div style="padding:20px;text-align:center;color:#999;font-size:13px;" onclick="showAddMenu()">➕ 添加联系人/群聊</div>
            </div>
        `;
    } else if (tab === 'contacts') {
        mainView.innerHTML = `
            <div class="contact-list">
                ${friends.map(f => `
                    <div class="list-item">
                        <div class="avatar" style="background:${getColor(f.id)}">${f.avatar}</div>
                        <div class="item-info"><div class="item-title">${f.name}</div><div class="item-message">${f.signature}</div></div>
                    </div>`).join('')}
                <div style="padding:20px;text-align:center;color:#999;font-size:13px;" onclick="showAddContact()">➕ 添加联系人</div>
            </div>
        `;
    } else if (tab === 'moments') {
        mainView.innerHTML = `
            <div class="moments-list" style="padding:16px;">
                <h3>朋友圈</h3>
                <div style="margin:12px 0;background:white;border-radius:16px;padding:16px;cursor:pointer;" onclick="showMomentsEditor()">
                    <p><strong>我</strong> 刚刚</p>
                    <p>今天天气真好，和喜欢的人一起听歌🎵</p>
                </div>
                <div style="background:white;border-radius:16px;padding:16px;margin-top:8px;">
                    <p><strong>林知夏</strong> 评论：你也是我的风景</p>
                </div>
            </div>
        `;
    }
}

function openChat(id) {
    const contact = contacts.find(c => c.id === id);
    if (!contact) return;
    currentChat = contact;
    const mainView = document.getElementById('mainView');
    mainView.innerHTML = `
        <div class="chat-page">
            <div class="chat-header">
                <div class="chat-header-left">
                    <span class="back-btn" onclick="renderMain('wechat')">←</span>
                    <div onclick="editRemark(${contact.id})">
                        <span class="chat-title" id="chatTitle">${contact.name}</span>
                        <span class="status-indicator" id="typingIndicator"></span>
                    </div>
                </div>
                <div class="chat-header-right">
                    <span class="header-icon" onclick="openSettings()">⚙️</span>
                    <span class="header-icon" onclick="openMiniPhone()">📱</span>
                </div>
            </div>
            <div class="messages-area" id="messagesArea">
                <div class="msg-row in"><div class="msg-bubble">你好呀，我在。</div></div>
                <div class="msg-row out"><div class="msg-bubble">今晚一起听歌？</div></div>
            </div>
            <div class="input-bar">
                <button class="icon-btn" onclick="sendVoice()">🎤</button>
                <input class="input-field" id="msgInput" placeholder="发消息..." onkeypress="if(event.key==='Enter')sendMessage()" />
                <button class="icon-btn" onclick="toggleEmojiPanel()">😊</button>
                <button class="icon-btn plus-btn" onclick="showPlusMenu()">➕</button>
            </div>
            <div id="emojiPanel" class="emoji-panel hidden">
                <span class="emoji-tab" onclick="showEmojiTab('sticker')">😀表情包</span>
                <span class="emoji-tab" onclick="showEmojiTab('face')">😊黄脸</span>
                <span class="emoji-tab" onclick="showEmojiTab('kaomoji')">(✿◡‿◡)颜文字</span>
                <div id="emojiContent"></div>
            </div>
        </div>
    `;
    // 模拟对方输入
    if (autoReplyOn) {
        setTimeout(() => {
            document.getElementById('typingIndicator').textContent = '正在输入中...';
            setTimeout(() => {
                document.getElementById('typingIndicator').textContent = '';
                const area = document.getElementById('messagesArea');
                area.innerHTML += `<div class="msg-row in"><div class="msg-bubble">${getRandomWordCard()}</div></div>`;
            }, 2000);
        }, 3000);
    }
}

function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;
    const area = document.getElementById('messagesArea');
    area.innerHTML += `<div class="msg-row out"><div class="msg-bubble">${text}</div></div>`;
    input.value = '';
    area.scrollTop = area.scrollHeight;
}

function sendVoice() {
    const area = document.getElementById('messagesArea');
    area.innerHTML += `<div class="msg-row out"><div class="msg-bubble">🎤 语音消息</div></div>`;
    area.scrollTop = area.scrollHeight;
}

function toggleEmojiPanel() {
    const panel = document.getElementById('emojiPanel');
    if (panel) panel.classList.toggle('hidden');
    showEmojiTab('face');
}

function showEmojiTab(type) {
    const container = document.getElementById('emojiContent');
    if (!container) return;
    if (type === 'face') {
        container.innerHTML = ['😀','😄','😊','😍','😘','😜','🤗','😎','🥰','😭','😡','👍','👏','🙏','💪','🤝','👀','💋','❤️','✨'].map(e => `<span class="emoji-item">${e}</span>`).join('');
    } else if (type === 'kaomoji') {
        container.innerHTML = ['(✿◡‿◡)','(｡♥‿♥｡)','(◕‿◕)','(づ｡◕‿‿◕｡)づ','(•‿•)','(≧◡≦)','(ノ◕ヮ◕)ノ*:･ﾟ✧','(¬‿¬)','(⁄ ⁄•⁄ω⁄•⁄ ⁄)','(ง •̀_•́)ง'].map(e => `<span class="emoji-item">${e}</span>`).join('');
    } else {
        container.innerHTML = ['🐱','🐶','🐼','🐸','🐵','🦊','🐰','🐻','🐨','🐯','🦁','🐮'].map(e => `<span class="emoji-item">${e}</span>`).join('');
    }
}

function showPlusMenu() {
    const modal = document.createElement('div');
    modal.className = 'modal-backdrop';
    modal.innerHTML = `
        <div class="modal-card">
            <h3>功能</h3>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;">
                <div class="app-icon" onclick="alert('视频通话')"><span>📹</span>视频</div>
                <div class="app-icon" onclick="alert('语音通话')"><span>📞</span>语音</div>
                <div class="app-icon" onclick="alert('转账')"><span>💰</span>转账</div>
                <div class="app-icon" onclick="alert('红包')"><span>🧧</span>红包</div>
                <div class="app-icon" onclick="showMusicInvite()"><span>🎵</span>一起听</div>
                <div class="app-icon" onclick="alert('送礼物')"><span>🎁</span>礼物</div>
                <div class="app-icon" onclick="alert('相册')"><span>🖼️</span>相册</div>
                <div class="app-icon" onclick="alert('收藏')"><span>⭐</span>收藏</div>
            </div>
            <button class="btn" onclick="this.closest('.modal-backdrop').remove()">关闭</button>
        </div>`;
    document.getElementById('phoneContainer').appendChild(modal);
}

function showMusicInvite() {
    const modal = document.createElement('div');
    modal.className = 'modal-backdrop';
    modal.innerHTML = `
        <div class="modal-card">
            <h3>邀请一起听歌</h3>
            <div class="music-player">
                <div class="music-avatar">🎵</div>
                <div>正在一起听歌<br><small>《慢慢喜欢你》</small></div>
                <button class="btn" onclick="this.closest('.modal-backdrop').remove()">开始</button>
            </div>
        </div>`;
    document.getElementById('phoneContainer').appendChild(modal);
}

function openSettings() {
    const modal = document.createElement('div');
    modal.className = 'modal-backdrop';
    modal.innerHTML = `
        <div class="modal-card">
            <h3>聊天设置</h3>
            <div style="margin:12px 0;">
                <label>回复速度（秒）</label>
                <div class="slider-row"><span>最快</span><input type="range" min="3" max="300" value="${messageSpeedMin}" onchange="messageSpeedMin=this.value"><span>${messageSpeedMin}秒</span></div>
                <div class="slider-row"><span>最慢</span><input type="range" min="3" max="300" value="${messageSpeedMax}" onchange="messageSpeedMax=this.value"><span>${messageSpeedMax}秒</span></div>
            </div>
            <div class="switch-row"><span>主动发消息</span><div class="switch ${autoReplyOn?'on':''}" onclick="autoReplyOn=!autoReplyOn;this.classList.toggle('on')"></div></div>
            <div class="switch-row"><span>已读不回</span><div class="switch on"></div></div>
            <div class="switch-row"><span>允许撤回(10%)</span><div class="switch on"></div></div>
            <div class="switch-row"><span>允许语音视频(3%)</span><div class="switch on"></div></div>
            <div class="switch-row"><span>允许音乐(3%)</span><div class="switch on"></div></div>
            <hr>
            <h4>字卡管理</h4>
            <div style="margin:8px 0;">
                <input class="input-field-mini" placeholder="搜索字卡..." onkeyup="filterWordCards(this.value)">
                <div id="wordCardList">
                    ${wordCards.map((w,i) => `<span class="tag">${w} <small onclick="deleteWordCard(${i})">🗑️</small></span>`).join('')}
                </div>
                <input class="input-field-mini" placeholder="批量添加，一行一个" onchange="addWordCards(this.value);this.value=''">
            </div>
            <hr>
            <h4>拍一拍</h4>
            <div id="patpatList">
                ${patPat.map((p,i) => `<span class="tag">${p} <small onclick="deletePatPat(${i})">🗑️</small></span>`).join('')}
            </div>
            <input class="input-field-mini" placeholder="添加拍一拍" onchange="addPatPat(this.value);this.value=''">
            <hr>
            <h4>状态</h4>
            <div id="statusList">
                ${statusList.map((s,i) => `<span class="tag">${s} <small onclick="deleteStatus(${i})">🗑️</small></span>`).join('')}
            </div>
            <input class="input-field-mini" placeholder="添加状态" onchange="addStatus(this.value);this.value=''">
            <hr>
            <button class="btn" onclick="backupAll()">💾 备份所有内容</button>
            <button class="btn btn-secondary" style="margin-top:8px;" onclick="this.closest('.modal-backdrop').remove()">关闭</button>
        </div>`;
    document.getElementById('phoneContainer').appendChild(modal);
}

function filterWordCards(keyword) {
    const container = document.getElementById('wordCardList');
    if (!container) return;
    const filtered = wordCards.filter(w => w.includes(keyword));
    container.innerHTML = filtered.map((w,i) => `<span class="tag">${w} <small onclick="deleteWordCard(${i})">🗑️</small></span>`).join('');
}

function deleteWordCard(index) { wordCards.splice(index, 1); openSettings(); }
function addWordCards(text) {
    const lines = text.split('\n').filter(l => l.trim());
    wordCards.push(...lines);
    openSettings();
}
function deletePatPat(index) { patPat.splice(index, 1); openSettings(); }
function addPatPat(text) { if(text.trim()){patPat.push(text.trim()); openSettings();} }
function deleteStatus(index) { statusList.splice(index, 1); openSettings(); }
function addStatus(text) { if(text.trim()){statusList.push(text.trim()); openSettings();} }

function getRandomWordCard() {
    return wordCards[Math.floor(Math.random() * wordCards.length)] || '嗯嗯';
}

function backupAll() {
    const data = {
        contacts, friends, wordCards, patPat, statusList,
        settings: { messageSpeedMin, messageSpeedMax, autoReplyOn, readReceipt }
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'backup.json';
    a.click();
}

function changeAvatar(id) {
    const contact = contacts.find(c => c.id === id);
    const newAvatar = prompt('输入新头像（emoji）:', contact.avatar);
    if (newAvatar) { contact.avatar = newAvatar; renderMain('wechat'); }
}

function editRemark(id) {
    const contact = contacts.find(c => c.id === id);
    const newName = prompt('输入备注名:', contact.name);
    if (newName) { contact.name = newName; document.getElementById('chatTitle').textContent = newName; }
}

function showAddContact() {
    const modal = document.createElement('div');
    modal.className = 'modal-backdrop';
    modal.innerHTML = `
        <div class="modal-card">
            <h3>添加联系人</h3>
            <input class="input-field-mini" id="newName" placeholder="名字">
            <input class="input-field-mini" id="newAvatar" placeholder="头像（emoji）">
            <input class="input-field-mini" id="newSignature" placeholder="签名">
            <button class="btn" style="width:100%;margin-top:8px;" onclick="saveNewContact()">保存</button>
            <button class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="this.closest('.modal-backdrop').remove()">取消</button>
        </div>`;
    document.getElementById('phoneContainer').appendChild(modal);
}

function saveNewContact() {
    const name = document.getElementById('newName').value;
    const avatar = document.getElementById('newAvatar').value || '😊';
    const signature = document.getElementById('newSignature').value || '';
    if (!name) return alert('请输入名字');
    const id = contacts.length + 1;
    contacts.push({ id, name, avatar, pinned: false, lastMsg: '', time: '刚刚', remark: name });
    friends.push({ id, name, avatar, signature });
    renderMain('wechat');
    document.querySelector('.modal-backdrop').remove();
}

function showAddGroup() {
    const name = prompt('输入群聊名称:');
    if (name) {
        const id = contacts.length + 1;
        contacts.push({ id, name, avatar: '👥', pinned: false, lastMsg: '群聊已创建', time: '刚刚', remark: name });
        renderMain('wechat');
    }
}
