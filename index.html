<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>微信·仿界 · 小手机</title>
    <style>
        /* 全局样式 & 主题变量 */
        :root {
            --bg: #ededed;
            --panel: #f7f7f7;
            --white: #ffffff;
            --green: #07c160;
            --green-dark: #06ad56;
            --text: #1a1a1a;
            --gray: #888;
            --light-gray: #e0e0e0;
            --bubble-in: #95ec69;
            --bubble-out: #ffffff;
            --border: #e0e0e0;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 16px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }
        /* 手机外壳 */
        .phone {
            width: 390px;
            height: 844px;
            background: var(--bg);
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 8px #2c2c2c;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #444;
        }
        /* 状态栏 */
        .status-bar {
            background: var(--panel);
            padding: 14px 20px 6px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            color: #000;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }
        /* 主视图区域 */
        .app-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }
        /* 三个底部导航 */
        .bottom-nav {
            display: flex;
            background: #f7f7f7;
            border-top: 1px solid #ccc;
            padding: 8px 0 6px;
            flex-shrink: 0;
        }
        .nav-item {
            flex: 1;
            text-align: center;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-item.active {
            color: var(--green);
            font-weight: 600;
        }
        .nav-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 2px;
        }
        /* 通用列表样式 */
        .chat-list, .contact-list, .moments-list {
            background: var(--white);
            flex: 1;
            overflow-y: auto;
        }
        .list-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: 0.1s;
            background: white;
        }
        .list-item:active { background: #f2f2f2; }
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #ddd;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }
        .item-info { flex: 1; }
        .item-title { font-size: 16px; font-weight: 500; }
        .item-message { font-size: 13px; color: #999; margin-top: 4px; }
        .item-time { font-size: 12px; color: #aaa; }
        /* 置顶标记 */
        .pinned-badge {
            background: #f0f0f0;
            color: #666;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 6px;
        }
        /* 聊天页面 */
        .chat-page {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #ededed;
        }
        .chat-header {
            background: #f7f7f7;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
        }
        .chat-header-left, .chat-header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .back-btn, .header-icon {
            cursor: pointer;
            font-size: 22px;
        }
        .chat-title {
            font-size: 18px;
            font-weight: 600;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg-row {
            display: flex;
            gap: 8px;
            max-width: 80%;
        }
        .msg-row.out { align-self: flex-end; flex-direction: row-reverse; }
        .msg-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            background: var(--bubble-in);
            font-size: 15px;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .msg-row.in .msg-bubble { background: white; }
        .msg-status { font-size: 11px; color: #999; margin-top: 4px; }
        .input-bar {
            background: #f7f7f7;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #ddd;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: #333;
        }
        .input-field {
            flex: 1;
            background: white;
            border-radius: 20px;
            padding: 10px 16px;
            border: 1px solid #ddd;
            font-size: 16px;
            outline: none;
        }
        .plus-btn {
            font-size: 28px;
        }
        /* 表情面板模拟 */
        .emoji-panel {
            background: white;
            border-top: 1px solid #ccc;
            padding: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .emoji-tab { padding: 6px 12px; background: #f0f0f0; border-radius: 20px; cursor: pointer; }
        /* 弹窗/设置 */
        .modal-backdrop {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 320px;
            max-height: 80%;
            overflow-y: auto;
        }
        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
        }
        .switch {
            width: 48px; height: 28px; background: #ccc; border-radius: 15px; position: relative;
            cursor: pointer;
        }
        .switch.on { background: var(--green); }
        .switch::after {
            content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
            background: white; border-radius: 50%; transition: 0.2s;
        }
        .switch.on::after { left: 23px; }
        /* 小手机页面 */
        .phone-app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 24px;
        }
        .app-icon {
            background: white;
            border-radius: 20px;
            padding: 16px 0;
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
        }
        /* 塔罗 */
        .tarot-card {
            background: #faf3e8;
            border-radius: 12px;
            padding: 16px;
            margin: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="phone" id="phoneContainer">
    <!-- 状态栏 (模拟) -->
    <div class="status-bar">
        <span>9:41</span>
        <span>📶 🔋 100%</span>
    </div>
    <!-- 主应用视图 -->
    <div id="mainView" class="app-view">
        <!-- 动态加载不同页面 -->
    </div>
    <!-- 底部导航栏 -->
    <div class="bottom-nav" id="bottomNav">
        <div class="nav-item active" data-tab="wechat"><span class="nav-icon">💬</span>微信</div>
        <div class="nav-item" data-tab="contacts"><span class="nav-icon">👥</span>通讯录</div>
        <div class="nav-item" data-tab="moments"><span class="nav-icon">🌐</span>朋友圈</div>
    </div>
</div>

<script>
    (function() {
        // 模拟数据
        const contacts = [
            { id: 1, name: '林知夏', avatar: '🌸', pinned: true, lastMsg: '今晚一起听歌吗？', time: '10:24' },
            { id: 2, name: '顾言', avatar: '🌿', pinned: false, lastMsg: '文件已发送', time: '昨天' },
            { id: 3, name: '沈听澜', avatar: '🌙', pinned: false, lastMsg: '哈哈，那个塔罗牌好准', time: '周三' },
            { id: 4, name: '陆星遥', avatar: '⭐', pinned: false, lastMsg: '朋友圈见~', time: '周一' },
        ];
        const friends = [
            { id: 1, name: '林知夏', avatar: '🌸', signature: '记得听歌' },
            { id: 2, name: '顾言', avatar: '🌿', signature: '...' },
            { id: 3, name: '沈听澜', avatar: '🌙', signature: '塔罗新手' },
            { id: 4, name: '陆星遥', avatar: '⭐', signature: '保持热爱' },
            { id: 5, name: '陈默', avatar: '🍃', signature: '万物有灵' },
        ];
        let currentTab = 'wechat';
        let currentChat = null; // 当前聊天对象

        // 渲染主界面
        function renderMain(tab) {
            const mainView = document.getElementById('mainView');
            if (tab === 'wechat') {
                mainView.innerHTML = `
                    <div class="chat-list">
                        ${contacts.map(c => `
                            <div class="list-item" data-id="${c.id}">
                                <div class="avatar" style="background:${getColor(c.id)}">${c.avatar}</div>
                                <div class="item-info">
                                    <div class="item-title">${c.name} ${c.pinned ? '<span class="pinned-badge">置顶</span>' : ''}</div>
                                    <div class="item-message">${c.lastMsg}</div>
                                </div>
                                <div class="item-time">${c.time}</div>
                            </div>`).join('')}
                    </div>
                `;
                attachChatListEvents();
            } else if (tab === 'contacts') {
                mainView.innerHTML = `
                    <div class="contact-list">
                        ${friends.map(f => `
                            <div class="list-item">
                                <div class="avatar" style="background:${getColor(f.id)}">${f.avatar}</div>
                                <div class="item-info"><div class="item-title">${f.name}</div><div class="item-message">${f.signature}</div></div>
                            </div>`).join('')}
                    </div>
                `;
            } else if (tab === 'moments') {
                mainView.innerHTML = `
                    <div class="moments-list" style="padding:16px;">
                        <h3>朋友圈</h3>
                        <div style="margin:12px 0;background:white;border-radius:16px;padding:16px;">
                            <p><strong>我</strong> 刚刚</p>
                            <p>今天天气真好，和喜欢的人一起听歌🎵</p>
                        </div>
                        <div style="background:white;border-radius:16px;padding:16px;margin-top:8px;">
                            <p><strong>林知夏</strong> 评论：你也是我的风景</p>
                        </div>
                    </div>
                `;
            }
        }

        function getColor(id) {
            const colors = ['#7c9eb2', '#b28c7c', '#8fbc8f', '#b0a1c9', '#d4a76a'];
            return colors[id % colors.length];
        }

        function attachChatListEvents() {
            document.querySelectorAll('.list-item').forEach(item => {
                item.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const contact = contacts.find(c => c.id == id);
                    if (contact) {
                        openChat(contact);
                    }
                });
            });
        }

        // 打开聊天页面
        function openChat(contact) {
            currentChat = contact;
            const mainView = document.getElementById('mainView');
            mainView.innerHTML = `
                <div class="chat-page">
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <span class="back-btn" id="backFromChat">←</span>
                            <span class="chat-title" id="chatTitle">${contact.name}</span>
                        </div>
                        <div class="chat-header-right">
                            <span class="header-icon" id="settingsBtn">⚙️</span>
                            <span class="header-icon" id="miniPhoneBtn">📱</span>
                        </div>
                    </div>
                    <div class="messages-area" id="messagesArea">
                        <div class="msg-row in"><div class="msg-bubble">你好呀，我在。</div></div>
                        <div class="msg-row out"><div class="msg-bubble">今晚一起听歌？</div></div>
                    </div>
                    <div class="input-bar">
                        <button class="icon-btn" id="voiceBtn">🎤</button>
                        <input class="input-field" id="msgInput" placeholder="发消息..." />
                        <button class="icon-btn" id="emojiBtn">😊</button>
                        <button class="icon-btn plus-btn" id="plusBtn">➕</button>
                    </div>
                    <div id="emojiPanel" class="emoji-panel hidden">
                        <span class="emoji-tab">😀表情</span><span class="emoji-tab">🐷动物</span><span class="emoji-tab">(✿◡‿◡)颜文字</span>
                    </div>
                </div>
            `;
            document.getElementById('backFromChat').addEventListener('click', () => renderMain('wechat'));
            document.getElementById('emojiBtn').addEventListener('click', () => {
                document.getElementById('emojiPanel').classList.toggle('hidden');
            });
            document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);
            document.getElementById('miniPhoneBtn').addEventListener('click', openMiniPhone);
            document.getElementById('msgInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && e.target.value.trim()) {
                    const area = document.getElementById('messagesArea');
                    area.innerHTML += `<div class="msg-row out"><div class="msg-bubble">${e.target.value}</div></div>`;
                    e.target.value = '';
                }
            });
        }

        // 设置弹窗 (模拟各种开关)
        function openSettingsModal() {
            const modal = document.createElement('div');
            modal.className = 'modal-backdrop';
            modal.innerHTML = `
                <div class="modal-card">
                    <h3>聊天设置</h3>
                    <div class="switch-row"><span>消息速度：最快3秒</span><div class="switch on" id="speedSwitch"></div></div>
                    <div class="switch-row"><span>已读不回</span><div class="switch on"></div></div>
                    <div class="switch-row"><span>允许撤回</span><div class="switch on"></div></div>
                    <div class="switch-row"><span>允许打电话/视频</span><div class="switch on"></div></div>
                    <div class="switch-row"><span>邀请音乐</span><div class="switch on"></div></div>
                    <div class="switch-row"><span>字卡组合(10%)</span><div class="switch on"></div></div>
                    <button id="closeModal" style="margin-top:20px;padding:10px;width:100%;background:var(--green);border:none;color:white;border-radius:10px;">完成</button>
                </div>`;
            document.getElementById('phoneContainer').appendChild(modal);
            modal.querySelector('#closeModal').addEventListener('click', () => modal.remove());
            modal.querySelector('#speedSwitch').addEventListener('click', function() { this.classList.toggle('on'); });
        }

        // 小手机页面 (包含购物、音乐、塔罗等)
        function openMiniPhone() {
            const modal = document.createElement('div');
            modal.className = 'modal-backdrop';
            modal.innerHTML = `
                <div class="modal-card" style="width:340px;">
                    <div style="display:flex;justify-content:space-between;"><h3>小手机</h3><span id="closeMini">✕</span></div>
                    <div class="phone-app-grid">
                        <div class="app-icon" id="shoppingApp">🛍️<br>购物</div>
                        <div class="app-icon" id="musicApp">🎵<br>音乐</div>
                        <div class="app-icon" id="tarotApp">🔮<br>塔罗</div>
                    </div>
                    <div id="tarotResult" class="tarot-card hidden">
                        <h4>塔罗占卜</h4>
                        <p>问：今天运势如何？</p>
                        <p>正位 愚者、逆位 宝剑三、正位 星币十</p>
                        <p><strong>解读：</strong>你们之间的爱充满自由与纯真，短暂悲伤后是稳固的承诺。</p>
                    </div>
                </div>`;
            document.getElementById('phoneContainer').appendChild(modal);
            modal.querySelector('#closeMini').addEventListener('click', () => modal.remove());
            modal.querySelector('#shoppingApp').addEventListener('click', () => alert('购物车：520000余额'));
            modal.querySelector('#musicApp').addEventListener('click', () => alert('一起听歌·网易云风格'));
            modal.querySelector('#tarotApp').addEventListener('click', function() {
                modal.querySelector('#tarotResult').classList.remove('hidden');
            });
        }

        // 底部导航切换
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                this.classList.add('active');
                const tab = this.dataset.tab;
                currentTab = tab;
                renderMain(tab);
            });
        });

        // 初始渲染
        renderMain('wechat');
    })();
</script>
</body>
</html>
