<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>爱因</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Roboto}
body{background:#f2f2f5;width:100%;height:100vh;overflow:hidden}
:root{--chat-bg:#f5f5f5;--bubble-self:#95ec90;--bubble-other:#fff;--wx-green:#07c160}
.wrapper{width:100%;height:100vh;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.page{display:none;width:100%;height:100%;flex-direction:column;overflow:hidden}
.page.active{display:flex}
.top-bar{height:50px;background:#f7f7f9;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 8px;position:relative;flex-shrink:0}
.top-bar .back{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:none}
.top-bar .back svg{width:18px;height:18px}
.top-bar .status-tag{padding:8px 10px;background:#eef0f3;border-radius:8px;font-size:11px;color:#555;margin-left:2px}
.top-bar .title-wrap{flex:1;text-align:center;position:relative}
.top-bar .title{font-size:17px;font-weight:500;cursor:pointer}
.top-bar .typing{font-size:11px;color:#999;position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);white-space:nowrap}
.top-bar .icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:none}
.top-bar .icon svg{width:18px;height:18px}
.chat-area{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-box{flex:1;overflow-y:auto;padding:12px;background:var(--chat-bg);display:flex;flex-direction:column}
.msg-row{display:flex;align-items:flex-start;gap:8px;margin:4px 0;width:100%}
.msg-row.me{justify-content:flex-end}
.msg-row.other{justify-content:flex-start}
.msg-avatar{width:36px;height:36px;border-radius:6px;background:#ccc;flex-shrink:0;cursor:pointer;background-size:cover;background-position:center;font-size:18px;display:flex;align-items:center;justify-content:center}
.msg-content{display:flex;flex-direction:column;max-width:65%}
.msg-bubble{padding:10px 13px;border-radius:14px;font-size:14px;word-break:break-word;position:relative}
.msg-row.me .msg-bubble{background:var(--bubble-self);color:#000}
.msg-row.other .msg-bubble{background:var(--bubble-other);color:#333}
.msg-row.me .msg-bubble .read{position:absolute;bottom:3px;right:6px;font-size:9px;color:#07c160}
.msg-time{font-size:9px;color:#999;margin-top:2px}
.msg-row.me .msg-time{text-align:right}
.msg-row.other .msg-time{text-align:left}
.msg-divider{text-align:center;font-size:12px;color:#999;margin:10px 0}
.input-bar{display:flex;gap:4px;padding:6px;background:#fff;border-top:1px solid #eee;flex-shrink:0}
.input-bar .btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:none;flex-shrink:0}
.input-bar .btn svg{width:18px;height:18px}
.input-bar input{flex:1;height:36px;border:1px solid #ddd;border-radius:8px;padding:0 10px;font-size:14px;outline:none;min-width:0}
.emoji-panel{background:#fff;border-top:1px solid #eee;display:none;flex-direction:column;flex-shrink:0;max-height:180px}
.emoji-tabs{display:flex;padding:6px 10px;gap:6px;border-bottom:1px solid #eee}
.emoji-tab{height:28px;padding:0 10px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#666;cursor:pointer;border-radius:14px;background:#f5f5f5;border:none}
.emoji-tab.active{background:#07c160;color:#fff}
.emoji-content{flex:1;overflow-y:auto;padding:6px}
.emoji-grid-emoji{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emoji-grid-emoji span{text-align:center;cursor:pointer;padding:4px;font-size:18px}
.emoji-grid-kaomoji{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.emoji-grid-kaomoji span{border:1px solid #e2e2e2;border-radius:6px;padding:4px;font-size:11px;cursor:pointer;text-align:center;min-height:30px;display:flex;align-items:center;justify-content:center}
.emoji-grid-img{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.emoji-grid-img .sticker{border:1px solid #e2e2e2;border-radius:6px;overflow:hidden;cursor:pointer}
.emoji-grid-img .sticker img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.add-bar{display:flex;gap:6px;padding:6px 10px;border-top:1px solid #eee}
.add-bar input{flex:1;height:28px;border:1px solid #ddd;border-radius:14px;padding:0 10px;font-size:12px;outline:none}
.add-bar button{height:28px;padding:0 12px;border:none;border-radius:14px;background:#07c160;color:#fff;font-size:12px;cursor:pointer}
.add-sticker-btn{width:36px;height:36px;border:1px dashed #ccc;border-radius:8px;background:#f7f7f7;color:#999;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.file-hide{display:none}
.tab-bar{height:50px;background:#fff;display:flex;border-top:1px solid #e5e5e5;flex-shrink:0}
.tab-bar button{flex:1;border:none;background:none;cursor:pointer;font-size:13px;color:#666}
.tab-bar button.active{color:#07c160;font-weight:600}
.tab-bar .red-dot{position:absolute;top:4px;right:50%;margin-right:-16px;width:7px;height:7px;background:#f53737;border-radius:50%;display:none}
.list-page{background:#fff;overflow-y:auto;flex:1}
.list-item{display:flex;align-items:center;padding:12px;border-bottom:1px solid #eee;cursor:pointer;position:relative}
.list-item .avatar{width:44px;height:44px;border-radius:6px;background:#ccc;margin-right:12px;font-size:22px;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;flex-shrink:0}
.list-item .name{font-size:15px;font-weight:500}
.list-item .pinned{background:#f0f0f0;color:#666;font-size:10px;padding:2px 6px;border-radius:8px;margin-left:6px}
.moment-page{background:#f5f5f5;overflow-y:auto;flex:1}
.moment-header{height:180px;background:#999;position:relative;background-size:cover;background-position:center;cursor:pointer}
.moment-header .camera{position:absolute;top:10px;right:14px;color:#fff;cursor:pointer;z-index:6}
.moment-header .camera svg{width:20px;height:20px}
.moment-header .mavatar{width:50px;height:50px;border-radius:50%;border:2px solid #fff;position:absolute;bottom:-20px;right:14px;background:#ccc;z-index:4;background-size:cover}
.moment-header .mname{position:absolute;bottom:10px;right:70px;color:#fff;font-size:15px;font-weight:600;z-index:5}
.moment-list{padding:30px 10px 10px}
.moment-item{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px}
.moment-item .mname{font-size:14px;font-weight:500}
.moment-item .mtext{margin-top:6px;font-size:13px}
.moment-item .mactions{display:flex;justify-content:flex-end;gap:12px;margin-top:6px}
.moment-item .mactions button{border:none;background:none;cursor:pointer;font-size:12px;color:#666;display:flex;align-items:center;gap:3px}
.moment-item .mactions button.liked{color:#e64340}
.moment-item .mactions svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5}
.moment-item .mactions button.liked svg{fill:#e64340;stroke:#e64340}
.like-list{font-size:11px;color:#576b95;margin-top:4px;display:none}
.comment-box{margin-top:6px;padding:6px;background:#f5f5f5;border-radius:6px;font-size:12px;display:none}
.comment-item{margin:3px 0;cursor:pointer;padding:3px 5px;border-radius:4px}
.comment-item:hover{background:#e8e8e8}
.mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99}
.panel{display:none;position:fixed;bottom:0;left:0;width:100%;background:#fff;border-radius:14px 14px 0 0;z-index:100;padding:16px;max-height:85%;overflow-y:auto}
.panel .pheader{display:flex;justify-content:space-between;margin-bottom:12px;font-size:16px;font-weight:500}
.panel .pheader button{border:none;background:none;cursor:pointer;font-size:18px;color:#999}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid .gitem{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:12px}
.grid .gitem .icon{width:44px;height:44px;border-radius:10px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:18px}
.pinput{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:10px;outline:none}
.pbtn{width:100%;height:40px;border:none;border-radius:8px;font-size:14px;cursor:pointer;color:#fff;background:#07c160}
.setting-group{margin-bottom:16px}
.setting-group h4{font-size:14px;margin-bottom:8px;color:#333}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px}
.setting-row input[type="range"]{width:50%}
.setting-row input[type="number"]{width:50px;padding:4px;border:1px solid #ddd;border-radius:4px;font-size:12px}
.switch{width:40px;height:22px;background:#ccc;border-radius:11px;position:relative;cursor:pointer;flex-shrink:0}
.switch.on{background:#07c160}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:0.2s}
.switch.on::after{left:20px}
.tag{display:inline-block;padding:4px 10px;background:#f0f0f0;border-radius:12px;margin:3px;font-size:12px;cursor:pointer}
.tag .del{color:#999;margin-left:4px}
textarea.pinput{min-height:60px;resize:none}
.text-moment-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:200;display:none;flex-direction:column;padding:16px}
.cover-preview{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:300;display:none;justify-content:center;align-items:center}
.cover-preview img{max-width:90%;max-height:90%}
.cover-preview .change{position:absolute;bottom:30px;right:20px;cursor:pointer;font-size:24px}
</style>
</head>
<body>
<div class="wrapper">

<!-- 聊天页面 -->
<div id="pageChat" class="page active">
<div class="top-bar">
<button class="back" onclick="showPage('chatList')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
<div class="status-tag" id="statusTag">✨在看海</div>
<div class="title-wrap">
<div class="title" id="chatTitle" onclick="editName()">爱因</div>
<div class="typing" id="typingIndicator"></div>
</div>
<button class="icon" onclick="showPhone()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/></svg></button>
<button class="icon" onclick="showSettings()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</div>
<div class="chat-area">
<div class="chat-box" id="chatBox"></div>
<div class="emoji-panel" id="emojiPanel">
<div class="emoji-tabs">
<button class="emoji-tab active" data-type="emoji" onclick="switchEmojiTab(this)">😊表情</button>
<button class="emoji-tab" data-type="kaomoji" onclick="switchEmojiTab(this)">颜文字</button>
<button class="emoji-tab" data-type="img" onclick="switchEmojiTab(this)">表情包</button>
</div>
<div class="emoji-content" id="emojiContent"></div>
<div class="add-bar" id="kaomojiBar">
<input id="newKaomojiInput" placeholder="添加颜文字，每行一个">
<button onclick="addKaomoji()">添加</button>
</div>
<div class="add-bar" id="stickerBar" style="display:none">
<div class="add-sticker-btn" onclick="document.getElementById('fileSticker').click()">+</div>
<input type="file" id="fileSticker" class="file-hide" accept="image/*" multiple onchange="addStickers()">
</div>
</div>
<div class="input-bar">
<button class="btn" onclick="toggleVoice()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg></button>
<input type="text" id="chatInput" placeholder="输入消息" onkeydown="if(event.key==='Enter')sendMsg()">
<button class="btn" onclick="toggleEmoji()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg></button>
<button class="btn" onclick="showPlus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
<button class="btn" onclick="sendMsg()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
</div>
</div>
</div>

<!-- 微信列表 -->
<div id="pageChatList" class="page">
<div class="top-bar"><div class="title">微信</div><button class="icon" onclick="showAddMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
<div class="list-page" id="chatListContainer"></div>
</div>

<!-- 联系人 -->
<div id="pageContact" class="page">
<div class="top-bar"><div class="title">联系人</div></div>
<div class="list-page" id="contactList"></div>
</div>

<!-- 朋友圈 -->
<div id="pageMoment" class="page">
<div class="top-bar"><div class="title">朋友圈</div></div>
<div class="moment-page">
<div class="moment-header" id="momentCover" onclick="previewCover()">
<div class="camera" id="momentCamera" ontouchstart="startPress()" ontouchend="endPress()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
<div class="mavatar"></div>
<div class="mname">我</div>
</div>
<div class="moment-list" id="momentList"></div>
</div>
</div>

<!-- 底部导航 -->
<div class="tab-bar" id="tabBar">
<button class="active" data-tab="chatList" onclick="switchTab(this)">微信</button>
<button data-tab="contact" onclick="switchTab(this)">联系人</button>
<button data-tab="moment" onclick="switchTab(this)">朋友圈<span class="red-dot" id="momentRedDot"></span></button>
</div>

<!-- 遮罩 -->
<div class="mask" id="mask" onclick="closeAll()"></div>

<!-- 设置面板 -->
<div class="panel" id="settingsPanel">
<div class="pheader"><span>设置</span><button onclick="closeAll()">×</button></div>
<div class="setting-group"><h4>回复速度（秒）</h4>
<div class="setting-row"><span>最快</span><input type="range" id="speedMin" min="3" max="300" value="3" oninput="document.getElementById('speedMinVal').textContent=this.value+'秒'"><span id="speedMinVal">3秒</span></div>
<div class="setting-row"><span>最慢</span><input type="range" id="speedMax" min="3" max="300" value="60" oninput="document.getElementById('speedMaxVal').textContent=this.value+'秒'"><span id="speedMaxVal">60秒</span></div>
</div>
<div class="setting-group"><h4>主动发消息</h4>
<div class="setting-row"><span>开启</span><div class="switch" onclick="this.classList.toggle('on')"></div></div>
<div class="setting-row"><span>间隔(分钟)</span><input type="number" id="autoInterval" value="30"></div>
</div>
<div class="setting-group"><h4>已读设置</h4>
<div class="setting-row"><span>已读回执</span><div class="switch on" onclick="this.classList.toggle('on')"></div></div>
<div class="setting-row"><span>已读不回(%)</span><input type="number" id="readIgnore" value="5"></div>
<div class="setting-row"><span>撤回概率(%)</span><input type="number" id="recallRate" value="10"></div>
</div>
<div class="setting-group"><h4>字卡</h4>
<textarea class="pinput" id="wordCardsInput" placeholder="批量添加字卡，每行一个"></textarea>
<button class="pbtn" onclick="addWordCards()">添加字卡</button>
<div id="wordCardList"></div>
</div>
<div class="setting-group"><h4>拍一拍</h4>
<textarea class="pinput" id="patpatInput" placeholder="批量添加拍一拍，每行一个"></textarea>
<button class="pbtn" onclick="addPatPat()">添加拍一拍</button>
<div id="patpatList"></div>
</div>
<div class="setting-group"><h4>状态</h4>
<textarea class="pinput" id="statusInput" placeholder="批量添加状态，每行一个"></textarea>
<button class="pbtn" onclick="addStatus()">添加状态</button>
<div id="statusList"></div>
</div>
<button class="pbtn" onclick="backupAll()">💾 备份所有内容</button>
</div>

<!-- 加号面板 -->
<div class="panel" id="plusPanel">
<div class="pheader"><span>功能</span><button onclick="closeAll()">×</button></div>
<div class="grid">
<div class="gitem" onclick="closeAll();sendRedpacket()"><div class="icon"><i class="fa fa-envelope-o"></i></div>红包</div>
<div class="gitem" onclick="closeAll();sendTransfer()"><div class="icon"><i class="fa fa-money"></i></div>转账</div>
<div class="gitem" onclick="closeAll();sendGift()"><div class="icon"><i class="fa fa-gift"></i></div>礼物</div>
<div class="gitem" onclick="closeAll();sendMusic()"><div class="icon"><i class="fa fa-music"></i></div>音乐</div>
<div class="gitem" onclick="closeAll();sendVideo()"><div class="icon"><i class="fa fa-video-camera"></i></div>视频</div>
<div class="gitem" onclick="closeAll();sendVoice()"><div class="icon"><i class="fa fa-phone"></i></div>语音</div>
</div>
</div>

<!-- 添加面板 -->
<div class="panel" id="addPanel">
<div class="pheader"><span>添加</span><button onclick="closeAll()">×</button></div>
<div class="grid" style="margin-bottom:12px;">
<div class="gitem" onclick="showCreateGroup()"><div class="icon">👥</div>创建群聊</div>
<div class="gitem" onclick="showAddFriend()"><div class="icon">➕</div>添加好友</div>
</div>
<div id="addFriendForm" style="display:none;">
<input class="pinput" id="newFriendName" placeholder="名字">
<input class="pinput" id="newFriendAvatar" placeholder="头像（emoji）">
<button class="pbtn" onclick="addFriend()">保存</button>
</div>
<div id="createGroupForm" style="display:none;">
<div id="memberSelect"></div>
<input class="pinput" id="groupName" placeholder="群名">
<button class="pbtn" onclick="createGroup()">创建</button>
</div>
</div>

<!-- 手机面板 -->
<div class="panel" id="phonePanel">
<div class="pheader"><span>手机</span><button onclick="closeAll()">×</button></div>
<div class="grid">
<div class="gitem" onclick="closeAll();alert('购物')"><div class="icon">🛍️</div>购物</div>
<div class="gitem" onclick="closeAll();alert('音乐')"><div class="icon">🎵</div>音乐</div>
<div class="gitem" onclick="closeAll();showTarot()"><div class="icon">🔮</div>塔罗</div>
<div class="gitem" onclick="closeAll();alert('心情')"><div class="icon">📔</div>心情</div>
</div>
</div>

<!-- 塔罗面板 -->
<div class="panel" id="tarotPanel">
<div class="pheader"><span>塔罗占卜</span><button onclick="closeAll()">×</button></div>
<input class="pinput" id="tarotQuestion" placeholder="输入你的问题...">
<button class="pbtn" onclick="drawTarot()">抽三张牌</button>
<div id="tarotResult"></div>
</div>

<!-- 文字朋友圈弹窗 -->
<div class="text-moment-modal" id="textMomentModal">
<div style="display:flex;justify-content:space-between;margin-bottom:12px;"><span onclick="closeTextMoment()" style="cursor:pointer;color:#666;">取消</span><span style="font-weight:500;">发表文字</span><span onclick="sendTextMoment()" style="cursor:pointer;color:#07c160;">发表</span></div>
<textarea id="textMomentText" placeholder="这一刻的想法..." style="flex:1;border:none;outline:none;font-size:15px;resize:none;"></textarea>
</div>

<!-- 封面预览 -->
<div class="cover-preview" id="coverPreview" onclick="closeCover()">
<img id="coverPreviewImg">
<div class="change" onclick="event.stopPropagation();document.getElementById('fileCover').click()">📷</div>
</div>
<input type="file" id="fileCover" class="file-hide" accept="image/*" onchange="setCover()">
<input type="file" id="fileMomentPic" class="file-hide" accept="image/*" onchange="sendMomentPic()">

</div>

<script>
var DATA_KEY='wx_final_v3';
var friends=[{id:1,name:'爱因',avatar:'🌸',pinned:true}];
var chatHistory={};var momentItems=[];var currentChatId=1;
var wordCards=['我喜欢你','今天天气真好','一起听歌吗','晚安','早安','想你了','哈哈哈','好呀','嗯嗯','在干嘛'];
var patpatList=['拍了拍你的头','拍了拍你的肩膀'];var statusList=['✨今日好运','🎵听歌中','💤休息中'];
var kaomojiList=['(๑•̀ㅂ•́)و✧','(≧∇≦)ﾉ','(｡•́︿•̀｡)','ヽ(✿ﾟ▽ﾟ)ノ','(>﹏<)','( ´･ᴗ･` )'];var stickerList=[];
var emojiList=['😀','😄','😊','😍','😘','🥰','😭','😡','👍','❤️','✨','🔥','😂','🤣','😇','🙂','🙃','😉','😌','😋','😜','😝','🤑','😎','🤓','🧐','😏','😒','🙄','😮','😯','😲','😳','🥺','😦','😧','😨','😰','😥','😢','😱','😖','😣','😞','😓','😩','😫','🥱','😴','💋','💍','💎','💯','💫','⭐','🌟','💥','💢','💦','💨','💤','💬','💭','🌸','🌺','🐶','🐱','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵'];
var pressTimer=null;

function saveAll(){try{localStorage.setItem(DATA_KEY,JSON.stringify({friends:friends,chatHistory:chatHistory,momentItems:momentItems,wordCards:wordCards,patpatList:patpatList,statusList:statusList,kaomojiList:kaomojiList,stickerList:stickerList}));}catch(e){}}
function loadAll(){try{var d=JSON.parse(localStorage.getItem(DATA_KEY));if(d){if(d.friends)friends=d.friends;if(d.chatHistory)chatHistory=d.chatHistory;if(d.momentItems)momentItems=d.momentItems;if(d.wordCards)wordCards=d.wordCards;if(d.patpatList)patpatList=d.patpatList;if(d.statusList)statusList=d.statusList;if(d.kaomojiList)kaomojiList=d.kaomojiList;if(d.stickerList)stickerList=d.stickerList;}}catch(e){}renderAll();}

function renderAll(){renderChatList();renderContact();renderMoments();renderWordCards();renderPatpat();renderStatus();renderEmoji();loadChat(currentChatId);}

function showPage(id){var pages=document.querySelectorAll('.page');for(var i=0;i<pages.length;i++)pages[i].classList.remove('active');document.getElementById('page'+id.charAt(0).toUpperCase()+id.slice(1)).classList.add('active');document.getElementById('tabBar').style.display=(id==='chat')?'none':'flex';}
function switchTab(el){var tabs=document.querySelectorAll('.tab-bar button');for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');el.classList.add('active');showPage(el.dataset.tab);if(el.dataset.tab==='moment')document.getElementById('momentRedDot').style.display='none';}

function renderChatList(){var c=document.getElementById('chatListContainer');c.innerHTML='';friends.forEach(function(f){c.innerHTML+='<div class="list-item" onclick="openChat('+f.id+')"><div class="avatar">'+f.avatar+'</div><div class="name">'+f.name+(f.pinned?'<span class="pinned">置顶</span>':'')+'</div></div>';});}
function renderContact(){var c=document.getElementById('contactList');c.innerHTML='';friends.forEach(function(f){c.innerHTML+='<div class="list-item"><div class="avatar">'+f.avatar+'</div><div class="name">'+f.name+'</div></div>';});}
function renderMoments(){var c=document.getElementById('momentList');c.innerHTML='';momentItems.forEach(function(m){c.innerHTML+='<div class="moment-item"><div class="mname">'+m.name+'</div><div class="mtext">'+m.content+'</div><div class="mactions"><button onclick="likeMoment(this)"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>点赞</button><button onclick="commentMoment(this)">💬评论</button></div><div class="like-list"></div><div class="comment-box"></div></div>';});}
function renderWordCards(){var c=document.getElementById('wordCardList');c.innerHTML='';wordCards.forEach(function(w,i){c.innerHTML+='<span class="tag">'+w+'<span class="del" onclick="deleteWordCard('+i+')">✕</span></span>';});}
function renderPatpat(){var c=document.getElementById('patpatList');c.innerHTML='';patpatList.forEach(function(p,i){c.innerHTML+='<span class="tag">'+p+'<span class="del" onclick="deletePatpat('+i+')">✕</span></span>';});}
function renderStatus(){var c=document.getElementById('statusList');c.innerHTML='';statusList.forEach(function(s,i){c.innerHTML+='<span class="tag">'+s+'<span class="del" onclick="deleteStatus('+i+')">✕</span></span>';});}

function renderEmoji(){var c=document.getElementById('emojiContent');var type=document.querySelector('.emoji-tab.active').dataset.type;
if(type==='emoji'){c.innerHTML='<div class="emoji-grid-emoji">';emojiList.forEach(function(e){c.innerHTML+='<span onclick="insertEmoji(\''+e+'\')">'+e+'</span>';});c.innerHTML+='</div>';}
else if(type==='kaomoji'){c.innerHTML='<div class="emoji-grid-kaomoji">';kaomojiList.forEach(function(k){c.innerHTML+='<span onclick="insertEmoji(\''+k+'\')">'+k+'</span>';});c.innerHTML+='</div>';}
else{c.innerHTML='<div class="emoji-grid-img">';stickerList.forEach(function(s){c.innerHTML+='<div class="sticker" onclick="sendSticker(\''+s+'\')"><img src="'+s+'"></div>';});c.innerHTML+='</div>';}}

function switchEmojiTab(el){var tabs=document.querySelectorAll('.emoji-tab');for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');el.classList.add('active');document.getElementById('kaomojiBar').style.display=el.dataset.type==='kaomoji'?'flex':'none';document.getElementById('stickerBar').style.display=el.dataset.type==='img'?'flex':'none';renderEmoji();}
function toggleEmoji(){var p=document.getElementById('emojiPanel');p.style.display=(p.style.display==='flex')?'none':'flex';if(p.style.display==='flex')renderEmoji();}
function insertEmoji(e){document.getElementById('chatInput').value+=e;}
function addKaomoji(){var v=document.getElementById('newKaomojiInput').value.trim();if(v){kaomojiList=kaomojiList.concat(v.split('\n').filter(function(l){return l.trim();}));document.getElementById('newKaomojiInput').value='';renderEmoji();saveAll();}}
function addStickers(){var files=document.getElementById('fileSticker').files;for(var i=0;i<files.length;i++){(function(f){var r=new FileReader();r.onload=function(ev){stickerList.push(ev.target.result);renderEmoji();saveAll();};r.readAsDataURL(f);})(files[i]);}}
function sendSticker(src){addMsg('<img src="'+src+'" style="max-width:120px;border-radius:8px;">',true);document.getElementById('emojiPanel').style.display='none';}

function openChat(id){currentChatId=id;var f=friends.find(function(x){return x.id===id;});if(f)document.getElementById('chatTitle').innerText=f.name;showPage('chat');loadChat(id);}
function loadChat(id){var box=document.getElementById('chatBox');box.innerHTML='';var msgs=chatHistory[id]||[];var lastMin='';msgs.forEach(function(m){var min=m.time.split(':')[0]+':'+m.time.split(':')[1];if(min!==lastMin){box.innerHTML+='<div class="msg-divider">'+min+'</div>';lastMin=min;}box.innerHTML+='<div class="msg-row '+(m.isMe?'me':'other')+'"><div class="msg-avatar">'+(m.isMe?'😊':(friends.find(function(f){return f.id===id;})||{}).avatar||'🌸')+'</div><div class="msg-content"><div class="msg-bubble">'+m.text+(m.isMe?'<span class="read">已读</span>':'')+'</div><div class="msg-time">'+m.time+'</div></div></div>';});box.scrollTop=box.scrollHeight;}
function getTime(){var d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');}

function addMsg(text,isMe){var time=getTime();if(!chatHistory[currentChatId])chatHistory[currentChatId]=[];chatHistory[currentChatId].push({text:text,isMe:isMe,time:time});loadChat(currentChatId);saveAll();}

function sendMsg(){var input=document.getElementById('chatInput');var text=input.value.trim();if(!text)return;addMsg(text,true);input.value='';var title=document.getElementById('chatTitle');var old=title.innerText;document.getElementById('typingIndicator').textContent='输入中...';var speedMin=parseInt(document.getElementById('speedMin').value)||3;var speedMax=parseInt(document.getElementById('speedMax').value)||60;var speed=Math.floor(Math.random()*(speedMax-speedMin+1))+speedMin;setTimeout(function(){document.getElementById('typingIndicator').textContent='';var reply=wordCards[Math.floor(Math.random()*wordCards.length)]||'嗯嗯';addMsg(reply,false);},speed*1000);}

function editName(){var title=document.getElementById('chatTitle');var old=title.innerText;var input=document.createElement('input');input.style.cssText='font-size:16px;border:none;outline:none;text-align:center;width:100px;background:transparent';input.value=old;title.innerHTML='';title.appendChild(input);input.focus();input.onblur=function(){title.innerText=input.value||old;var f=friends.find(function(x){return x.id===currentChatId;});if(f)f.name=title.innerText;saveAll();};}

function showPanel(id){document.getElementById('mask').style.display='block';document.getElementById(id).style.display='block';}
function closeAll(){document.getElementById('mask').style.display='none';document.querySelectorAll('.panel').forEach(function(p){p.style.display='none';});document.getElementById('emojiPanel').style.display='none';}
function showSettings(){showPanel('settingsPanel');}
function showPlus(){showPanel('plusPanel');}
function showAddMenu(){showPanel('addPanel');}
function showPhone(){showPanel('phonePanel');}
function showTarot(){showPanel('tarotPanel');}
function showAddFriend(){document.getElementById('addFriendForm').style.display='block';document.getElementById('createGroupForm').style.display='none';}
function showCreateGroup(){document.getElementById('createGroupForm').style.display='block';document.getElementById('addFriendForm').style.display='none';renderMembers();}
function toggleVoice(){var input=document.getElementById('chatInput');input.placeholder=input.placeholder==='输入消息'?'🎤按住说话':'输入消息';}

function addWordCards(){var v=document.getElementById('wordCardsInput').value.trim();if(v){wordCards=wordCards.concat(v.split('\n').filter(function(l){return l.trim();}));document.getElementById('wordCardsInput').value='';renderWordCards();saveAll();}}
function addPatPat(){var v=document.getElementById('patpatInput').value.trim();if(v){patpatList=patpatList.concat(v.split('\n').filter(function(l){return l.trim();}));document.getElementById('patpatInput').value='';renderPatpat();saveAll();}}
function addStatus(){var v=document.getElementById('statusInput').value.trim();if(v){statusList=statusList.concat(v.split('\n').filter(function(l){return l.trim();}));document.getElementById('statusInput').value='';renderStatus();saveAll();}}
function deleteWordCard(i){wordCards.splice(i,1);renderWordCards();saveAll();}
function deletePatpat(i){patpatList.splice(i,1);renderPatpat();saveAll();}
function deleteStatus(i){statusList.splice(i,1);renderStatus();saveAll();}

function backupAll(){var data={friends:friends,chatHistory:chatHistory,momentItems:momentItems,wordCards:wordCards,patpatList:patpatList,statusList:statusList,kaomojiList:kaomojiList,stickerList:stickerList};var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup.json';a.click();}

function addFriend(){var name=document.getElementById('newFriendName').value.trim();var avatar=document.getElementById('newFriendAvatar').value.trim()||'😊';if(!name)return alert('请输入名字');friends.push({id:friends.length+1,name:name,avatar:avatar,pinned:false});closeAll();renderChatList();renderContact();saveAll();alert('已添加！');}
function renderMembers(){var c=document.getElementById('memberSelect');c.innerHTML='<p style="font-size:13px;color:#666;margin-bottom:8px;">选择成员：</p>';friends.forEach(function(f,i){c.innerHTML+='<label style="display:block;padding:6px;font-size:14px;"><input type="checkbox" class="gm" value="'+i+'"> '+f.avatar+' '+f.name+'</label>';});}
function createGroup(){var n=document.getElementById('groupName').value||'群聊';var s=document.querySelectorAll('.gm:checked');if(s.length===0)return alert('请选择成员');friends.push({id:friends.length+1,name:n,avatar:'👥',pinned:false});closeAll();renderChatList();renderContact();saveAll();alert('群聊已创建！');}

function sendRedpacket(){var money=prompt('红包金额：');if(!money)return;addMsg('🧧 红包 ¥'+money,true);}
function sendTransfer(){var money=prompt('转账金额：');if(!money)return;addMsg('💰 转账 ¥'+money,true);}
function sendGift(){addMsg('🎁 送你一份礼物',true);}
function sendMusic(){addMsg('🎵 示例歌曲',true);}
function sendVideo(){addMsg('📹 视频通话',true);}
function sendVoice(){addMsg('📞 语音通话',true);}

function likeMoment(btn){btn.classList.toggle('liked');var ll=btn.closest('.moment-item').querySelector('.like-list');if(btn.classList.contains('liked')){ll.style.display='block';ll.innerText='我 赞了';}else{ll.style.display='none';ll.innerText='';}}
function commentMoment(btn){var cb=btn.closest('.moment-item').querySelector('.comment-box');cb.style.display='block';if(cb.querySelector('input'))return;var input=document.createElement('input');input.style.cssText='width:100%;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:12px;margin-top:4px;';input.placeholder='写评论...';input.onkeydown=function(e){if(e.key==='Enter'&&input.value.trim()){cb.innerHTML+='<div class="comment-item"><strong>我</strong>：'+input.value+'</div>';input.remove();}};cb.appendChild(input);input.focus();}

function startPress(){pressTimer=setTimeout(function(){document.getElementById('textMomentModal').style.display='flex';},600);}
function endPress(){clearTimeout(pressTimer);document.getElementById('fileMomentPic').click();}
function closeTextMoment(){document.getElementById('textMomentModal').style.display='none';}
function sendTextMoment(){var v=document.getElementById('textMomentText').value.trim();if(v){addMoment('我',v);closeTextMoment();document.getElementById('textMomentText').value='';}}
function sendMomentPic(){var f=document.getElementById('fileMomentPic').files[0];if(f){addMoment('我','<img src="'+URL.createObjectURL(f)+'" style="max-width:100%;border-radius:8px;">');}}
function addMoment(name,content){momentItems.push({name:name,content:content});renderMoments();saveAll();if(Math.random()<0.5){setTimeout(function(){var items=document.querySelectorAll('.moment-item');if(items.length>0){var cb=items[0].querySelector('.comment-box');cb.style.display='block';cb.innerHTML='<div class="comment-item" onclick="replyComment(this)"><strong>爱因</strong>：'+wordCards[Math.floor(Math.random()*wordCards.length)]+'</div>';document.getElementById('momentRedDot').style.display='block';}},2000);}}
function replyComment(el){var cb=el.closest('.comment-box');if(cb.querySelector('input'))return;var input=document.createElement('input');input.style.cssText='width:100%;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:12px;margin-top:4px;';input.placeholder='回复...';input.onkeydown=function(e){if(e.key==='Enter'&&input.value.trim()){cb.innerHTML+='<div class="comment-item"><strong>我</strong>：'+input.value+'</div>';input.remove();}};cb.appendChild(input);input.focus();}

function previewCover(){document.getElementById('coverPreviewImg').src=getComputedStyle(document.getElementById('momentCover')).backgroundImage.replace(/url\("?(.*?)"?\)/,'$1');document.getElementById('coverPreview').style.display='flex';}
function closeCover(){document.getElementById('coverPreview').style.display='none';}
function setCover(){var f=document.getElementById('fileCover').files[0];if(f){document.getElementById('momentCover').style.backgroundImage='url('+URL.createObjectURL(f)+')';closeCover();}}

function drawTarot(){var q=document.getElementById('tarotQuestion').value.trim();if(!q)return alert('请输入问题');var cards=[{name:'愚者',pos:'正位',desc:'新的开始，纯真的爱'},{name:'恋人',pos:'正位',desc:'深爱彼此，心意相通'},{name:'星币十',pos:'正位',desc:'稳固的承诺，幸福的未来'}];var r=document.getElementById('tarotResult');r.innerHTML='<div style="margin-top:12px;"><strong>问题：</strong>'+q+'</div>';cards.forEach(function(c){r.innerHTML+='<div style="margin:8px 0;padding:8px;background:#f5f5f5;border-radius:8px;"><strong>'+c.pos+' '+c.name+'</strong><br><span style="font-size:12px;">'+c.desc+'</span></div>';});r.innerHTML+='<div style="margin-top:8px;font-size:13px;"><strong>解读：</strong>爱因非常爱你，你们的关系充满纯真与美好。</div>';}

showPage('chat');loadAll();
if(momentItems.length===0){addMoment('我','今天天气真好☀️');addMoment('爱因','想你了💕');}
</script>
</body>
</html>
