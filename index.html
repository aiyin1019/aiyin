<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>梦角微信模拟器</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Roboto}
body{background:#f2f2f5;margin:0;padding:0;width:100%;height:100vh;overflow:hidden}
:root{--chat-bg:#f5f5f5;--bubble-self:#95ec90;--bubble-other:#fff;--wx-green:#07c160}
.wrapper{width:100%;height:100vh;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.page{display:none;width:100%;height:100%;flex-direction:column;overflow:hidden}
.page.active{display:flex}
.wx-top-bar{height:56px;background:#f7f7f9;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 8px;position:relative;flex-shrink:0}
.wx-left-area{display:flex;align-items:center;gap:4px;position:absolute;left:8px;top:50%;transform:translateY(-50%);z-index:10}
.wx-back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wx-back svg{width:18px;height:18px}
.status-tag{padding:11px 12px;background:#eef0f3;border-radius:8px;font-size:12px;color:#555;white-space:nowrap}
.wx-title-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:0 70px}
.wx-title{font-size:17px;font-weight:500;cursor:pointer}
.wx-top-right{display:flex;gap:14px;position:absolute;right:12px;top:50%;transform:translateY(-50%);align-items:center}
.wx-icon{cursor:pointer;color:#333;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.chat-area{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-box{flex:1;overflow-y:auto;padding:12px;background:var(--chat-bg);min-height:0;display:flex;flex-direction:column}
.msg-row{display:flex;align-items:flex-start;gap:8px;margin:4px 0;width:100%}
.msg-row-left{justify-content:flex-start}
.msg-row-right{justify-content:flex-end}
.msg-avatar{width:40px;height:40px;border-radius:6px;background:#ccc;flex-shrink:0;cursor:pointer;background-size:cover;background-position:center}
.msg-avatar-hidden{visibility:hidden}
.msg-content{display:flex;flex-direction:column;max-width:72%}
.msg-bubble{padding:10px 13px;border-radius:14px;font-size:14px;word-break:break-word}
.msg-left .msg-bubble{background:var(--bubble-other);color:#333}
.msg-right .msg-bubble{background:var(--bubble-self);color:#000}
.msg-status{font-size:10px;color:#999;margin-top:2px}
.msg-left .msg-status{text-align:left;padding-left:4px}
.msg-right .msg-status{text-align:right;padding-right:4px}
.msg-right .read-mark{color:#07c160}
.msg-time-divider{text-align:center;font-size:12px;color:#999;margin:12px 0}
.chat-input-wrap{border-top:1px solid #eee;padding:8px 10px;background:#fff;display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn-voice,.btn-face,.btn-more,.btn-send{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#444;background:transparent;border:none;flex-shrink:0}
.btn-voice svg,.btn-face svg,.btn-more svg,.btn-send svg{width:22px;height:22px}
.chat-input{flex:1;height:42px;border:1px solid #ddd;border-radius:8px;padding:0 12px;font-size:15px;outline:none;min-width:0}
.voice-hold-btn{flex:1;height:42px;border:1px solid #ddd;border-radius:8px;background:#f5f5f5;display:none;align-items:center;justify-content:center;font-size:15px;color:#333;cursor:pointer}
.emoji-panel{background:#fff;border-top:1px solid #eee;display:none;flex-direction:column;flex-shrink:0}
.emoji-top-tabs{display:flex;padding:8px 12px;gap:8px;border-bottom:1px solid #eee}
.emoji-top-tab{height:36px;padding:0 12px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#666;cursor:pointer;border-radius:18px;background:#f5f5f5}
.emoji-top-tab.active{background:#07c160;color:#fff}
.emoji-content-area{height:140px;overflow:hidden}
.emoji-grid-emoji{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px;height:100%;overflow-y:auto}
.emoji-grid-emoji .emoji-item{text-align:center;cursor:pointer;padding:6px;font-size:20px}
.emoji-grid-kaomoji{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;height:100%;overflow-y:auto}
.emoji-grid-kaomoji .emoji-item{border:1px solid #e2e2e2;border-radius:6px;padding:6px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer}
.emoji-grid-img{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;height:100%;overflow-y:auto}
.img-sticker-item{border:1px solid #e2e2e2;border-radius:8px;overflow:hidden;cursor:pointer}
.img-sticker-item img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.bottom-bar{display:flex;gap:8px;padding:8px 12px;border-top:1px solid #eee}
.kaomoji-input{flex:1;padding:10px 12px;border:1px solid #ddd;border-radius:20px;font-size:14px;outline:none}
.add-text-btn{padding:10px 16px;border:none;border-radius:20px;background:#07c160;color:#fff;font-size:14px;cursor:pointer}
.add-sticker-btn{width:52px;height:52px;border:1px dashed #ccc;border-radius:8px;background:#f7f7f7;color:#999;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.file-input-hide{display:none}
.tab-bar{height:60px;background:#fff;display:flex;border-top:1px solid #e5e5e5;flex-shrink:0}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:11px;color:#666;position:relative}
.tab-item.active{color:var(--wx-green)}
.red-dot{position:absolute;top:8px;right:50%;margin-right:-14px;width:8px;height:8px;background:#f53737;border-radius:50%;display:none}
.chat-list-page{background:#fff;overflow-y:auto;flex:1}
.chat-list-item{display:flex;align-items:center;padding:12px;border-bottom:1px solid #eee;cursor:pointer}
.chat-list-avatar{width:48px;height:48px;border-radius:6px;background:#ccc;margin-right:12px;cursor:pointer;background-size:cover;background-position:center}
.chat-list-info{flex:1}
.chat-list-name{font-size:16px;font-weight:500}
.chat-list-desc{font-size:13px;color:#999;margin-top:3px}
.contact-page{background:#f5f5f5;overflow-y:auto;flex:1}
.contact-group{background:#fff;margin-bottom:8px}
.contact-group-title{padding:6px 12px;background:#f2f2f5;font-size:13px;color:#666}
.contact-item{display:flex;align-items:center;padding:10px 12px;cursor:pointer}
.contact-avatar{width:42px;height:42px;border-radius:6px;background:#ccc;margin-right:12px}
.contact-name{font-size:15px}
.moment-page{background:#f5f5f5;overflow-y:auto;flex:1}
.moment-header{height:220px;background:#999;position:relative;background-size:cover;background-position:center;cursor:pointer}
.moment-header-top-camera{position:absolute;top:12px;right:16px;color:#fff;cursor:pointer;z-index:6}
.moment-avatar{width:70px;height:70px;border-radius:50%;border:2px solid #fff;position:absolute;bottom:-35px;right:16px;background:#ccc;z-index:4}
.moment-name{position:absolute;bottom:15px;right:100px;color:#fff;font-size:17px;font-weight:600;z-index:5}
.moment-list{padding:44px 12px 20px}
.moment-item{background:#fff;margin-bottom:8px;padding:12px;border-radius:10px}
.moment-avatar-small{width:40px;height:40px;border-radius:50%;background:#ccc;float:left;margin-right:10px}
.moment-name-small{font-size:15px;color:#333;font-weight:500}
.moment-time{font-size:12px;color:#999;margin-top:2px}
.moment-text{margin-top:8px;font-size:14px}
.moment-actions{display:flex;justify-content:flex-end;gap:16px;margin-top:8px}
.action-btn{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;color:#666;border:none;background:none}
.action-btn.liked{color:#e64340}
.like-list{font-size:12px;color:#576b95;margin-top:4px;display:none}
.comment-box{margin-top:8px;padding:8px;background:#f5f5f5;border-radius:6px;font-size:13px;display:none}
.comment-item{margin:4px 0}
.comment-reply{color:#576b95;cursor:pointer;margin-left:8px}
.text-moment-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:999;display:none;flex-direction:column;padding:16px}
.text-moment-cancel{font-size:16px;color:#666;cursor:pointer}
.text-moment-send{color:var(--wx-green);font-size:16px;cursor:pointer}
.text-moment-input{flex:1;width:100%;border:none;outline:none;font-size:16px;resize:none}
.cover-preview-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;justify-content:center;align-items:center}
.cover-change-btn{position:absolute;bottom:40px;right:24px;width:36px;height:36px;background:rgba(255,255,255,0.65);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.file-input{display:none}
.plus-menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px}
.plus-menu-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.plus-menu-icon{width:56px;height:56px;border-radius:12px;background:#f5f5f5;display:flex;align-items:center;justify-content:center}
.plus-menu-icon i{font-size:24px;color:#333}
.plus-menu-label{font-size:12px;color:#333}
.redpack-msg{width:220px;background:#e63923;border-radius:8px;color:#fff;padding:14px 12px;cursor:pointer}
.redpack-msg.opened{opacity:0.5;pointer-events:none}
.transfer-msg{width:220px;background:#ffb340;border-radius:8px;color:#fff;padding:14px 12px;cursor:pointer}
.transfer-msg.received{opacity:0.5;pointer-events:none}
.gift-msg{width:220px;background:#2563eb;border-radius:8px;color:#fff;padding:14px 12px}
.music-msg{width:240px;background:#f7f7f7;border-radius:8px;padding:12px;display:flex;gap:10px}
.modal-mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9996}
.modal-panel{display:none;position:fixed;bottom:0;left:0;width:100%;background:#fff;border-radius:16px 16px 0 0;z-index:9997;padding:20px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-close{font-size:18px;color:#999;cursor:pointer}
.modal-input{width:100%;padding:14px 12px;border:1px solid #eee;border-radius:10px;font-size:15px;outline:none;margin-bottom:16px}
.modal-btn{width:100%;height:48px;border:none;border-radius:8px;font-size:16px;cursor:pointer;color:#fff}
.call-float{display:none;position:fixed;top:80px;right:16px;width:100px;border-radius:12px;z-index:9999;background:#333;cursor:move}
.call-float-content{padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff}
.call-hangup-btn{width:36px;height:36px;border-radius:50%;background:#f53f3f;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>
</head>
<body>
<div class="wrapper">
<div id="pageChatDetail" class="page active">
<div class="wx-top-bar">
<div class="wx-left-area">
<div class="wx-back" id="btnBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></div>
<div class="status-tag">在看海</div>
</div>
<div class="wx-title-wrap"><div class="wx-title" id="noteTitle">梦角</div></div>
<div class="wx-top-right">
<span class="wx-icon" onclick="alert('小手机')"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/></svg></span>
<span class="wx-icon" onclick="alert('设置')"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg></span>
</div>
</div>
<div class="chat-area">
<div class="chat-box" id="chatBox"></div>
<div class="emoji-panel" id="emojiPanel">
<div class="emoji-top-tabs"><div class="emoji-top-tab active" data-type="emoji">emoji</div><div class="emoji-top-tab" data-type="kaomoji">颜文字</div><div class="emoji-top-tab" data-type="img">表情包</div></div>
<div class="emoji-content-area"><div class="emoji-grid-emoji" id="emojiGridEmoji"></div><div class="emoji-grid-kaomoji" id="emojiGridKaomoji" style="display:none"></div><div class="emoji-grid-img" id="emojiGridImg" style="display:none"></div></div>
<div class="bottom-bar" id="barKaomoji"><input class="kaomoji-input" id="newKaomojiInput" placeholder="添加颜文字"><button class="add-text-btn" onclick="addKaomojiText()">添加</button></div>
<div class="bottom-bar" id="barImg" style="display:none"><div class="add-sticker-btn" onclick="document.getElementById('fileSticker').click()">+</div><input type="file" id="fileSticker" class="file-input-hide" accept="image/*" multiple></div>
</div>
<div class="chat-input-wrap">
<div class="btn-voice" onclick="toggleVoice()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg></div>
<input type="text" class="chat-input" id="chatInput" placeholder="输入消息">
<div class="voice-hold-btn" id="voiceHoldBtn">按住说话</div>
<div class="btn-face" id="btnFace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg></div>
<div class="btn-more" onclick="showPlusMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
<div class="btn-send" onclick="sendMsg()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></div>
</div>
</div>
</div>

<div id="pageChatList" class="page">
<div style="height:56px;background:#f7f7f9;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:center;position:relative;"><span style="font-size:17px;font-weight:500;">微信</span><span style="position:absolute;right:16px;cursor:pointer;" onclick="showAddMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span></div>
<div class="chat-list-page"><div class="chat-list-item" id="goToChat"><div class="chat-list-avatar" id="listAvatar"></div><div class="chat-list-info"><div class="chat-list-name" id="listName">梦角</div><div class="chat-list-desc">点击进入聊天</div></div></div></div>
</div>

<div id="pageContact" class="page">
<div style="height:56px;background:#f7f7f9;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:center;"><span style="font-size:17px;font-weight:500;">联系人</span></div>
<div class="contact-page" id="contactList"></div>
</div>

<div id="pageMoment" class="page">
<div style="height:56px;background:#f7f7f9;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:center;"><span style="font-size:17px;font-weight:500;">发现</span></div>
<div class="moment-page"><div class="moment-header" id="momentCover"><div class="moment-header-top-camera" id="momentHeaderTopCamera"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div><div class="moment-avatar"></div><div class="moment-name">我</div></div><div class="moment-list" id="momentList"></div></div>
</div>

<div class="tab-bar" id="tabBar">
<div class="tab-item active" data-tab="chatList"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>微信</span></div>
<div class="tab-item" data-tab="contact"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>联系人</span></div>
<div class="tab-item" data-tab="moment"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg><span>朋友圈</span><span class="red-dot" id="momentRedDot"></span></div>
</div>

<div class="text-moment-modal" id="textMomentModal"><div style="display:flex;justify-content:space-between;margin-bottom:16px;"><span class="text-moment-cancel" id="textMomentCancel">取消</span><span style="font-size:17px;font-weight:500;">发表文字</span><span class="text-moment-send" id="textMomentSend">发表</span></div><textarea class="text-moment-input" placeholder="这一刻的想法..."></textarea></div>
<div class="cover-preview-modal" id="coverPreviewModal"><img class="cover-preview-img" id="coverPreviewImg" style="max-width:90%;max-height:90%;"/><div class="cover-change-btn" id="coverChangeBtn">📷</div></div>
<input type="file" class="file-input" id="fileInputCover" accept="image/*">
<input type="file" class="file-input" id="fileInputMomentPic" accept="image/*">
<div class="modal-mask" id="modalMask"></div>
<div class="modal-panel" id="redpacketModal"><div class="modal-header"><span>发红包</span><span class="modal-close" onclick="closeModal('redpacketModal')">×</span></div><input class="modal-input" id="rpMoney" type="number" placeholder="金额"><input class="modal-input" id="rpRemark" placeholder="恭喜发财"><button class="modal-btn" style="background:#e64340;" onclick="sendRedpacket()">塞钱进红包</button></div>
<div class="modal-panel" id="transferModal"><div class="modal-header"><span>转账</span><span class="modal-close" onclick="closeModal('transferModal')">×</span></div><input class="modal-input" id="tfMoney" type="number" placeholder="金额"><button class="modal-btn" style="background:#ff9500;" onclick="sendTransfer()">转账</button></div>
<div class="modal-panel" id="addContactModal"><div class="modal-header"><span>添加联系人</span><span class="modal-close" onclick="closeModal('addContactModal')">×</span></div><input class="modal-input" id="newName" placeholder="名字"><input class="modal-input" id="newAvatar" placeholder="头像emoji"><button class="modal-btn" style="background:#07c160;" onclick="saveContact()">保存</button></div>
<div class="modal-panel" id="createGroupModal"><div class="modal-header"><span>创建群聊</span><span class="modal-close" onclick="closeModal('createGroupModal')">×</span></div><div id="memberSelect"></div><input class="modal-input" id="groupName" placeholder="群名"><button class="modal-btn" style="background:#07c160;" onclick="createGroup()">创建</button></div>
<div class="call-float" id="callFloat"><div class="call-float-content"><div id="callStatus">呼叫中...</div><button class="call-hangup-btn" onclick="endCall()">📞</button></div></div>
</div>

<script>
// ===== 数据持久化系统 =====
const DATA_KEY='wx_simulator_v1';
function saveAll(){
    localStorage.setItem(DATA_KEY,JSON.stringify({
        chatBox:document.getElementById('chatBox').innerHTML,
        momentList:document.getElementById('momentList').innerHTML,
        avatarConfig,friends,kaomojiList,stickerList,
        noteTitle:document.getElementById('noteTitle').innerText,
        lastMsgIsMe,lastMsgTime
    }));
}
function loadAll(){
    const d=JSON.parse(localStorage.getItem(DATA_KEY));
    if(!d)return;
    if(d.chatBox)document.getElementById('chatBox').innerHTML=d.chatBox;
    if(d.momentList)document.getElementById('momentList').innerHTML=d.momentList;
    if(d.avatarConfig){avatarConfig=d.avatarConfig;if(avatarConfig.otherAvatar)document.getElementById('listAvatar').style.background=`url(${avatarConfig.otherAvatar})`;}
    if(d.friends)friends=d.friends;
    if(d.kaomojiList)kaomojiList=d.kaomojiList;
    if(d.stickerList)stickerList=d.stickerList;
    if(d.noteTitle)document.getElementById('noteTitle').innerText=d.noteTitle;
    if(d.lastMsgIsMe!==undefined)lastMsgIsMe=d.lastMsgIsMe;
    if(d.lastMsgTime)lastMsgTime=d.lastMsgTime;
    renderContact();renderKaomoji();renderStickers();
}

let lastMsgIsMe=null,lastMsgTime=null;
let avatarConfig={myAvatar:'',otherAvatar:''};
let kaomojiList=['(๑•̀ㅂ•́)و✧','(≧∇≦)ﾉ','(｡•́︿•̀｡)','ヽ(✿ﾟ▽ﾟ)ノ'];
let stickerList=[];
let friends=[{id:1,name:'梦角',avatar:''}];
const emojiList=['😀','😄','😊','😍','😘','🥰','😭','😡','👍','❤️','✨','🔥'];

const pages={chatDetail:document.getElementById('pageChatDetail'),chatList:document.getElementById('pageChatList'),contact:document.getElementById('pageContact'),moment:document.getElementById('pageMoment')};
function showPage(id){Object.values(pages).forEach(p=>p.classList.remove('active'));pages[id].classList.add('active');document.getElementById('tabBar').style.display=(id==='chatDetail')?'none':'flex';}
showPage('chatDetail');
loadAll();

document.getElementById('btnBack').onclick=()=>{showPage('chatList');saveAll();};
document.getElementById('goToChat').onclick=()=>showPage('chatDetail');
document.querySelectorAll('.tab-item').forEach(tab=>{tab.onclick=()=>{document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));tab.classList.add('active');showPage(tab.dataset.tab);};});

document.getElementById('noteTitle').onclick=function(){const old=this.innerText;const input=document.createElement('input');input.style.cssText='font-size:17px;border:none;outline:none;text-align:center;width:100px;background:transparent';input.value=old;this.innerHTML='';this.appendChild(input);input.focus();input.onblur=()=>{this.innerText=input.value||old;document.getElementById('listName').textContent=this.innerText;saveAll();};};

const chatBox=document.getElementById('chatBox'),chatInput=document.getElementById('chatInput'),emojiPanel=document.getElementById('emojiPanel'),btnFace=document.getElementById('btnFace'),gridEmoji=document.getElementById('emojiGridEmoji'),gridKaomoji=document.getElementById('emojiGridKaomoji'),gridImg=document.getElementById('emojiGridImg'),barKaomoji=document.getElementById('barKaomoji'),barImg=document.getElementById('barImg');

function getNowTime(){const d=new Date();return `${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;}
function getNowMin(){const d=new Date();return `${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;}
function renderEmoji(){gridEmoji.innerHTML='';emojiList.forEach(e=>{const div=document.createElement('div');div.className='emoji-item';div.textContent=e;div.onclick=()=>{chatInput.value+=e;};gridEmoji.appendChild(div);});}
function renderKaomoji(){gridKaomoji.innerHTML='';kaomojiList.forEach(t=>{const div=document.createElement('div');div.className='emoji-item';div.textContent=t;div.onclick=()=>{chatInput.value+=t;};gridKaomoji.appendChild(div);});}
function renderStickers(){gridImg.innerHTML='';stickerList.forEach(src=>{const wrap=document.createElement('div');wrap.className='img-sticker-item';const img=document.createElement('img');img.src=src;wrap.onclick=()=>addBubble('',true,src);gridImg.appendChild(wrap);});}
function addKaomojiText(){const v=document.getElementById('newKaomojiInput').value.trim();if(v){kaomojiList.push(v);renderKaomoji();saveAll();}}
document.getElementById('fileSticker').onchange=e=>{[...e.target.files].forEach(f=>{const r=new FileReader();r.onload=ev=>{stickerList.push(ev.target.result);renderStickers();saveAll();};r.readAsDataURL(f);});};
document.querySelectorAll('.emoji-top-tab').forEach(tab=>{tab.onclick=function(){document.querySelectorAll('.emoji-top-tab').forEach(t=>t.classList.remove('active'));this.classList.add('active');gridEmoji.style.display='none';gridKaomoji.style.display='none';gridImg.style.display='none';barKaomoji.style.display='none';barImg.style.display='none';if(this.dataset.type==='emoji')gridEmoji.style.display='grid';if(this.dataset.type==='kaomoji'){gridKaomoji.style.display='grid';barKaomoji.style.display='flex';}if(this.dataset.type==='img'){gridImg.style.display='grid';barImg.style.display='flex';}};});
btnFace.onclick=e=>{e.stopPropagation();emojiPanel.style.display=emojiPanel.style.display==='flex'?'none':'flex';};
document.addEventListener('click',e=>{if(emojiPanel.style.display==='flex'&&!emojiPanel.contains(e.target)&&!btnFace.contains(e.target))emojiPanel.style.display='none';});

function checkTime(){const m=getNowMin();if(lastMsgTime&&lastMsgTime!==m){const div=document.createElement('div');div.className='msg-time-divider';div.innerText=m;chatBox.appendChild(div);}lastMsgTime=m;}
function showTyping(){const title=document.getElementById('noteTitle');const old=title.innerText;title.innerText='输入中...';setTimeout(()=>{title.innerText=old;},2000);}

function addBubble(text,isMe,imgSrc=null){
checkTime();
const showAvatar=(lastMsgIsMe!==isMe);lastMsgIsMe=isMe;
const row=document.createElement('div');row.className=`msg-row ${isMe?'msg-row-right':'msg-row-left'}`;
const avatar=document.createElement('div');avatar.className=`msg-avatar ${showAvatar?'':'msg-avatar-hidden'}`;
avatar.style.background=(isMe?avatarConfig.myAvatar:avatarConfig.otherAvatar)?`url(${isMe?avatarConfig.myAvatar:avatarConfig.otherAvatar})`:'#ccc';
avatar.onclick=()=>changeAvatar(isMe);
const content=document.createElement('div');content.className='msg-content';
const bubble=document.createElement('div');bubble.className='msg-bubble';
if(imgSrc){const img=document.createElement('img');img.src=imgSrc;img.style.cssText='max-width:180px;border-radius:12px;display:block;';bubble.appendChild(img);}else{bubble.innerText=text;}
const status=document.createElement('div');status.className='msg-status';
if(isMe){const read=Math.random()>0.05;status.innerHTML=read?`<span class="read-mark">已读</span> ${getNowTime()}`:getNowTime();}else{status.innerText=getNowTime();}
content.appendChild(bubble);content.appendChild(status);
if(isMe){row.appendChild(content);row.appendChild(avatar);}else{row.appendChild(avatar);row.appendChild(content);}
chatBox.appendChild(row);chatBox.scrollTop=chatBox.scrollHeight;saveAll();
}

function sendMsg(){const text=chatInput.value.trim();if(!text)return;addBubble(text,true);chatInput.value='';showTyping();setTimeout(()=>{if(Math.random()<0.1){addBubble('对方撤回了一条消息',false);}else{addBubble('收到啦🥰',false);}},1500);}
chatInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});

function changeAvatar(isMe){const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>{if(isMe){avatarConfig.myAvatar=ev.target.result;}else{avatarConfig.otherAvatar=ev.target.result;document.getElementById('listAvatar').style.background=`url(${ev.target.result})`;}saveAll();alert('头像已更换！');};r.readAsDataURL(f);}};input.click();}

function toggleVoice(){const input=document.getElementById('chatInput');const voice=document.getElementById('voiceHoldBtn');if(input.style.display==='none'){input.style.display='block';voice.style.display='none';}else{input.style.display='none';voice.style.display='flex';}}
document.getElementById('voiceHoldBtn').onclick=()=>{addBubble('🎤语音消息',true);showTyping();setTimeout(()=>addBubble('收到啦🥰',false),1500);};

function showPlusMenu(){const modal=document.createElement('div');modal.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:999;display:flex;align-items:flex-end;';modal.innerHTML=`<div style="width:100%;background:#fff;border-radius:20px 20px 0 0;padding:20px;"><div class="plus-menu-grid"><div class="plus-menu-item" onclick="showModal('redpacketModal')"><div class="plus-menu-icon"><i class="fa fa-envelope-o"></i></div><div class="plus-menu-label">红包</div></div><div class="plus-menu-item" onclick="showModal('transferModal')"><div class="plus-menu-icon"><i class="fa fa-money"></i></div><div class="plus-menu-label">转账</div></div><div class="plus-menu-item" onclick="this.closest('div[style]').parentElement.remove();addGift()"><div class="plus-menu-icon"><i class="fa fa-gift"></i></div><div class="plus-menu-label">礼物</div></div><div class="plus-menu-item" onclick="this.closest('div[style]').parentElement.remove();addMusic()"><div class="plus-menu-icon"><i class="fa fa-music"></i></div><div class="plus-menu-label">音乐</div></div><div class="plus-menu-item" onclick="this.closest('div[style]').parentElement.remove();startCall()"><div class="plus-menu-icon"><i class="fa fa-video-camera"></i></div><div class="plus-menu-label">视频</div></div><div class="plus-menu-item" onclick="this.closest('div[style]').parentElement.remove();startCall()"><div class="plus-menu-icon"><i class="fa fa-phone"></i></div><div class="plus-menu-label">语音</div></div></div></div>`;document.body.appendChild(modal);modal.onclick=e=>{if(e.target===modal)modal.remove();};}

function showModal(id){document.getElementById('modalMask').style.display='block';document.getElementById(id).style.display='block';}
function closeModal(id){document.getElementById('modalMask').style.display='none';document.getElementById(id).style.display='none';}
document.getElementById('modalMask').onclick=()=>{document.getElementById('modalMask').style.display='none';document.querySelectorAll('.modal-panel').forEach(p=>p.style.display='none');};

function sendRedpacket(){const m=document.getElementById('rpMoney').value;const r=document.getElementById('rpRemark').value||'恭喜发财';if(!m)return alert('请输入金额');addRedpack(m,r);closeModal('redpacketModal');}
function sendTransfer(){const m=document.getElementById('tfMoney').value;if(!m)return alert('请输入金额');addTransfer(m);closeModal('transferModal');}

function addRedpack(money,remark){
const row=document.createElement('div');row.className='msg-row msg-row-right';
row.innerHTML=`<div class="msg-content"><div class="msg-bubble msg-right"><div class="redpack-msg" data-opened="0" onclick="openRedpacket(this,'${money}','${remark}')"><div class="rp-amount">¥${money}</div><div class="rp-desc">${remark}</div></div></div><div class="msg-status"><span class="read-mark">已读</span> ${getNowTime()}</div></div><div class="msg-avatar" style="background:${avatarConfig.myAvatar?`url(${avatarConfig.myAvatar})`:'#ccc'};background-size:cover"></div>`;
chatBox.appendChild(row);chatBox.scrollTop=chatBox.scrollHeight;saveAll();
}

function openRedpacket(el,money,remark){
if(el.dataset.opened==='1')return;el.dataset.opened='1';
const modal=document.createElement('div');modal.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;';
modal.innerHTML=`<div style="width:280px;background:#e63923;border-radius:16px;text-align:center;overflow:hidden;"><div style="padding:30px 20px;background:linear-gradient(180deg,#f5553c,#e63923);"><div style="color:#fdd835;font-size:14px;">${remark}</div><div style="width:80px;height:80px;border-radius:50%;background:#fdd835;margin:20px auto;display:flex;align-items:center;justify-content:center;font-size:28px;color:#e63923;font-weight:bold;cursor:pointer;" onclick="receiveRedpack(this,'${money}')">開</div><div style="color:#fff;font-size:12px;">梦角的红包</div></div><div style="height:20px;background:#fdd835;"></div><div style="background:#fff;padding:14px;" onclick="this.closest('div[style]').remove()">关闭</div></div>`;
document.body.appendChild(modal);modal.onclick=e=>{if(e.target===modal)modal.remove();};
el.classList.add('opened');saveAll();
}

function receiveRedpack(btn,money){
const amount=(Math.random()*parseFloat(money)).toFixed(2);
btn.parentElement.innerHTML=`<div style="color:#fdd835;">已领取</div><div style="color:#fff;font-size:36px;font-weight:bold;margin:10px 0;">¥${amount}</div><div style="color:#fdd835;font-size:12px;">已存入零钱</div>`;
}

function addTransfer(money){
const row=document.createElement('div');row.className='msg-row msg-row-right';
row.innerHTML=`<div class="msg-content"><div class="msg-bubble msg-right"><div class="transfer-msg" data-received="0" onclick="confirmTransfer(this,'${money}')"><div class="tf-amount">¥${money}</div><div class="tf-desc">转账</div></div></div><div class="msg-status"><span class="read-mark">已读</span> ${getNowTime()}</div></div><div class="msg-avatar" style="background:${avatarConfig.myAvatar?`url(${avatarConfig.myAvatar})`:'#ccc'};background-size:cover"></div>`;
chatBox.appendChild(row);chatBox.scrollTop=chatBox.scrollHeight;saveAll();
}

function confirmTransfer(el,money){
if(el.dataset.received==='1')return;el.dataset.received='1';
el.querySelector('.tf-desc').innerText='已收款';
el.classList.add('received');
const tip=document.createElement('div');tip.className='msg-time-divider';tip.innerText=`梦角已收款 ¥${money}`;chatBox.appendChild(tip);chatBox.scrollTop=chatBox.scrollHeight;saveAll();
}

function addGift(){const row=document.createElement('div');row.className='msg-row msg-row-right';row.innerHTML=`<div class="msg-content"><div class="msg-bubble msg-right"><div class="gift-msg">送你一份礼物🎁</div></div><div class="msg-status"><span class="read-mark">已读</span> ${getNowTime()}</div></div><div class="msg-avatar" style="background:#ccc"></div>`;chatBox.appendChild(row);chatBox.scrollTop=chatBox.scrollHeight;saveAll();}
function addMusic(){const row=document.createElement('div');row.className='msg-row msg-row-right';row.innerHTML=`<div class="msg-content"><div class="msg-bubble msg-right"><div class="music-msg"><div class="music-cover"></div><div class="music-info"><div class="music-song">示例歌曲</div><div class="music-singer">歌手</div></div></div></div><div class="msg-status"><span class="read-mark">已读</span> ${getNowTime()}</div></div><div class="msg-avatar" style="background:#ccc"></div>`;chatBox.appendChild(row);chatBox.scrollTop=chatBox.scrollHeight;saveAll();}

function startCall(){const cf=document.getElementById('callFloat');cf.style.display='block';document.getElementById('callStatus').textContent='呼叫中...';setTimeout(()=>{if(Math.random()<0.6){document.getElementById('callStatus').textContent='对方无法接听';setTimeout(()=>cf.style.display='none',2000);}else{document.getElementById('callStatus').textContent='通话中';}},2000);}
function endCall(){document.getElementById('callFloat').style.display='none';}

function showAddMenu(){const menu=document.createElement('div');menu.style.cssText='position:fixed;top:60px;right:16px;background:#fff;border-radius:12px;box-shadow:0 2px 20px rgba(0,0,0,0.15);z-index:999;min-width:140px;';menu.innerHTML=`<div style="padding:12px 16px;cursor:pointer;" onclick="showModal('createGroupModal');renderMembers();this.remove()">👥 创建群聊</div><div style="padding:12px 16px;cursor:pointer;border-top:1px solid #eee;" onclick="showModal('addContactModal');this.remove()">➕ 添加联系人</div>`;document.body.appendChild(menu);setTimeout(()=>{document.addEventListener('click',function close(e){if(!menu.contains(e.target)){menu.remove();document.removeEventListener('click',close);}});},100);}

function saveContact(){const n=document.getElementById('newName').value.trim();const a=document.getElementById('newAvatar').value.trim()||'😊';if(!n)return alert('请输入名字');friends.push({id:friends.length+1,name:n,avatar:a});closeModal('addContactModal');renderContact();saveAll();alert('已添加！');}
function renderContact(){const c=document.getElementById('contactList');c.innerHTML='';friends.forEach(f=>{c.innerHTML+=`<div class="contact-group"><div class="contact-group-title">朋友</div><div class="contact-item"><div class="contact-avatar">${f.avatar}</div><div class="contact-name">${f.name}</div></div></div>`;});}
function renderMembers(){const c=document.getElementById('memberSelect');c.innerHTML='<p style="font-size:13px;color:#666;margin-bottom:8px;">选择成员：</p>';friends.forEach((f,i)=>{c.innerHTML+=`<label style="display:block;padding:8px;border-bottom:1px solid #eee;"><input type="checkbox" class="gm" value="${i}"> ${f.avatar} ${f.name}</label>`;});}
function createGroup(){const n=document.getElementById('groupName').value||'群聊';const s=document.querySelectorAll('.gm:checked');alert(`群聊「${n}」已创建，${s.length}人`);closeModal('createGroupModal');}

const headerTopCamera=document.getElementById('momentHeaderTopCamera');let pressTimer=null;
headerTopCamera.addEventListener('touchstart',()=>{pressTimer=setTimeout(()=>{document.getElementById('textMomentModal').style.display='flex';},600);});
headerTopCamera.addEventListener('touchend',()=>{clearTimeout(pressTimer);document.getElementById('fileInputMomentPic').click();});
document.getElementById('fileInputMomentPic').onchange=e=>{if(e.target.files[0])addMoment('我',`<img src="${URL.createObjectURL(e.target.files[0])}" style="max-width:100%;border-radius:8px;margin-top:6px">`);};
document.getElementById('textMomentCancel').onclick=()=>document.getElementById('textMomentModal').style.display='none';
document.getElementById('textMomentSend').onclick=()=>{const v=document.querySelector('.text-moment-input').value.trim();if(v){addMoment('我',v);document.getElementById('textMomentModal').style.display='none';document.querySelector('.text-moment-input').value='';}};

function addMoment(name,content){
const div=document.createElement('div');div.className='moment-item';
div.innerHTML=`<div class="moment-avatar-small"></div><div class="moment-name-small">${name}</div><div class="moment-time">刚刚</div><div class="moment-text">${content}</div><div class="moment-actions"><button class="action-btn" onclick="toggleLike(this)">❤️ 点赞</button><button class="action-btn" onclick="commentMoment(this)">💬 评论</button></div><div class="like-list"></div><div class="comment-box"></div>`;
document.getElementById('momentList').prepend(div);
if(Math.random()<0.6){setTimeout(()=>{const cb=div.querySelector('.comment-box');cb.style.display='block';cb.innerHTML=`<div class="comment-item"><strong>梦角</strong>：${kaomojiList[Math.floor(Math.random()*kaomojiList.length)]} <span class="comment-reply" onclick="replyTo(this)">回复</span></div>`;document.getElementById('momentRedDot').style.display='block';saveAll();},2000);}
if(Math.random()<0.3){setTimeout(()=>{addMoment('梦角',kaomojiList[Math.floor(Math.random()*kaomojiList.length)]);document.getElementById('momentRedDot').style.display='block';},5000);}
saveAll();
}

function toggleLike(btn){btn.classList.toggle('liked');const ll=btn.closest('.moment-item').querySelector('.like-list');ll.style.display='block';ll.innerText=btn.classList.contains('liked')?'我 赞了':'我 取消了赞';saveAll();}
function commentMoment(btn){const cb=btn.closest('.moment-item').querySelector('.comment-box');cb.style.display='block';if(cb.querySelector('input'))return;const input=document.createElement('input');input.style.cssText='width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:4px;';input.placeholder='写评论...';input.onkeydown=e=>{if(e.key==='Enter'&&input.value.trim()){cb.innerHTML+=`<div class="comment-item"><strong>我</strong>：${input.value}</div>`;input.remove();saveAll();}};cb.appendChild(input);input.focus();}
function replyTo(span){const cb=span.closest('.comment-box');if(cb.querySelector('input'))return;const input=document.createElement('input');input.style.cssText='width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:4px;';input.placeholder='回复梦角...';input.onkeydown=e=>{if(e.key==='Enter'&&input.value.trim()){cb.innerHTML+=`<div class="comment-item"><strong>我</strong> 回复 <strong>梦角</strong>：${input.value}</div>`;input.remove();saveAll();}};cb.appendChild(input);input.focus();}

const momentCover=document.getElementById('momentCover');
const coverPreviewModal=document.getElementById('coverPreviewModal');
momentCover.onclick=e=>{if(e.target.closest('.moment-header-top-camera'))return;document.getElementById('coverPreviewImg').src=getComputedStyle(momentCover).backgroundImage.match(/url\("?(.*?)"?\)/)?.[1]||'';coverPreviewModal.style.display='flex';};
coverPreviewModal.onclick=e=>{if(e.target===coverPreviewModal)coverPreviewModal.style.display='none';};
document.getElementById('coverChangeBtn').onclick=()=>document.getElementById('fileInputCover').click();
document.getElementById('fileInputCover').onchange=e=>{if(e.target.files[0]){momentCover.style.backgroundImage=`url(${URL.createObjectURL(e.target.files[0])})`;coverPreviewModal.style.display='none';saveAll();}};

renderEmoji();renderKaomoji();renderStickers();renderContact();
if(avatarConfig.otherAvatar)document.getElementById('listAvatar').style.background=`url(${avatarConfig.otherAvatar})`;
</script>
</body>
</html>
