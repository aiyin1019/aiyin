<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>爱因</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Roboto}
body{background:#f2f2f5;margin:0;padding:0;width:100%;height:100vh;overflow:hidden}
:root{--chat-bg:#f5f5f5;--bubble-self:#95ec90;--bubble-other:#fff;--wx-green:#07c160}
.wrapper{width:100%;height:100vh;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.page{display:none;width:100%;height:100%;flex-direction:column;overflow:hidden}
.page.active{display:flex}
.wx-top-bar{height:56px;background:#f7f7f9;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 8px;position:relative;flex-shrink:0}
.wx-left-area{display:flex;align-items:center;gap:4px;position:absolute;left:8px;top:50%;transform:translateY(-50%);z-index:10}
.wx-back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wx-back svg{width:18px;height:18px}
.status-tag{padding:10px 12px;background:#eef0f3;border-radius:8px;font-size:12px;color:#555;white-space:nowrap}
.wx-title-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:0 60px}
.wx-title{font-size:17px;font-weight:500;cursor:pointer}
.wx-top-right{display:flex;gap:10px;position:absolute;right:10px;top:50%;transform:translateY(-50%);align-items:center}
.wx-icon{cursor:pointer;color:#333;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.chat-area{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-box{flex:1;overflow-y:auto;padding:12px;background:var(--chat-bg);min-height:0;display:flex;flex-direction:column}
.msg-row{display:flex;align-items:flex-start;gap:8px;margin:4px 0;width:100%}
.msg-row-left{justify-content:flex-start}
.msg-row-right{justify-content:flex-end}
.msg-avatar{width:40px;height:40px;border-radius:6px;background:#ccc;flex-shrink:0;cursor:pointer;background-size:cover;background-position:center}
.msg-avatar-hidden{visibility:hidden}
.msg-content{display:flex;flex-direction:column;max-width:70%}
.msg-bubble{padding:10px 13px;border-radius:14px;font-size:14px;word-break:break-word;position:relative}
.msg-left .msg-bubble{background:var(--bubble-other);color:#333}
.msg-right .msg-bubble{background:var(--bubble-self);color:#000}
.msg-status{font-size:10px;color:#999;margin-top:2px}
.msg-left .msg-status{text-align:left;padding-left:44px}
.msg-right .msg-status{text-align:right;padding-right:44px}
.msg-right .read-mark{position:absolute;bottom:4px;right:8px;font-size:9px;color:#07c160}
.msg-time-divider{text-align:center;font-size:12px;color:#999;margin:12px 0}
.chat-input-wrap{border-top:1px solid #eee;padding:8px 6px;background:#fff;display:flex;gap:4px;align-items:center;flex-shrink:0}
.btn-voice,.btn-face,.btn-more,.btn-send{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#444;background:transparent;border:none;flex-shrink:0}
.btn-voice svg,.btn-face svg,.btn-more svg,.btn-send svg{width:18px;height:18px}
.chat-input{flex:1;height:40px;border:1px solid #ddd;border-radius:8px;padding:0 12px;font-size:15px;outline:none;min-width:0}
.voice-hold-btn{flex:1;height:40px;border:1px solid #ddd;border-radius:8px;background:#f5f5f5;display:none;align-items:center;justify-content:center;font-size:15px;color:#333;cursor:pointer}
.emoji-panel{background:#fff;border-top:1px solid #eee;display:none;flex-direction:column;flex-shrink:0}
.emoji-top-tabs{display:flex;padding:8px 12px;gap:8px;border-bottom:1px solid #eee}
.emoji-top-tab{height:32px;padding:0 12px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#666;cursor:pointer;border-radius:16px;background:#f5f5f5}
.emoji-top-tab.active{background:#07c160;color:#fff}
.emoji-content-area{height:120px;overflow:hidden}
.emoji-grid-emoji{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px;height:100%;overflow-y:auto}
.emoji-grid-emoji .emoji-item{text-align:center;cursor:pointer;padding:6px;font-size:20px}
.emoji-grid-kaomoji{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;height:100%;overflow-y:auto}
.emoji-grid-kaomoji .emoji-item{border:1px solid #e2e2e2;border-radius:6px;padding:6px;min-height:40px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
.emoji-grid-img{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;height:100%;overflow-y:auto}
.img-sticker-item{border:1px solid #e2e2e2;border-radius:8px;overflow:hidden;cursor:pointer}
.img-sticker-item img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.bottom-bar{display:flex;gap:8px;padding:8px 12px;border-top:1px solid #eee}
.kaomoji-input{flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:16px;font-size:13px;outline:none}
.add-text-btn{padding:8px 14px;border:none;border-radius:16px;background:#07c160;color:#fff;font-size:13px;cursor:pointer}
.add-sticker-btn{width:44px;height:44px;border:1px dashed #ccc;border-radius:8px;background:#f7f7f7;color:#999;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.file-input-hide{display:none}
.tab-bar{height:56px;background:#fff;display:flex;border-top:1px solid #e5e5e5;flex-shrink:0}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:11px;color:#666;position:relative}
.tab-item.active{color:var(--wx-green)}
.tab-item svg{width:22px;height:22px}
.red-dot{position:absolute;top:6px;right:50%;margin-right:-14px;width:8px;height:8px;background:#f53737;border-radius:50%;display:none}
.chat-list-page{background:#fff;overflow-y:auto;flex:1}
.chat-list-item{display:flex;align-items:center;padding:12px;border-bottom:1px solid #eee;cursor:pointer}
.chat-list-avatar{width:48px;height:48px;border-radius:6px;background:#ccc;margin-right:12px;cursor:pointer;background-size:cover;background-position:center}
.chat-list-info{flex:1}
.chat-list-name{font-size:16px;font-weight:500}
.chat-list-desc{font-size:13px;color:#999;margin-top:3px}
.contact-page{background:#f5f5f5;overflow-y:auto;flex:1}
.contact-group{background:#fff;margin-bottom:8px}
.contact-group-title{padding:6px 14px;background:#f2f2f5;font-size:13px;color:#666}
.contact-item{display:flex;align-items:center;padding:10px 14px;cursor:pointer}
.contact-avatar{width:40px;height:40px;border-radius:6px;background:#ccc;margin-right:12px;background-size:cover;background-position:center}
.contact-name{font-size:15px}
.moment-page{background:#f5f5f5;overflow-y:auto;flex:1}
.moment-header{height:200px;background:#999;position:relative;background-size:cover;background-position:center;cursor:pointer}
.moment-header-top-camera{position:absolute;top:12px;right:16px;color:#fff;cursor:pointer;z-index:6}
.moment-avatar{width:60px;height:60px;border-radius:50%;border:2px solid #fff;position:absolute;bottom:-30px;right:16px;background:#ccc;z-index:4}
.moment-name{position:absolute;bottom:12px;right:90px;color:#fff;font-size:16px;font-weight:600;z-index:5}
.moment-list{padding:40px 12px 20px}
.moment-item{background:#fff;margin-bottom:8px;padding:12px;border-radius:10px}
.moment-avatar-small{width:36px;height:36px;border-radius:50%;background:#ccc;float:left;margin-right:10px}
.moment-name-small{font-size:14px;color:#333;font-weight:500}
.moment-time{font-size:11px;color:#999;margin-top:2px}
.moment-text{margin-top:6px;font-size:13px}
.moment-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:6px}
.action-btn{display:flex;align-items:center;gap:3px;cursor:pointer;font-size:12px;color:#666;border:none;background:none}
.action-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5}
.action-btn.liked{color:#e64340}
.action-btn.liked svg{fill:#e64340;stroke:#e64340}
.like-list{font-size:11px;color:#576b95;margin-top:4px;display:none}
.comment-box{margin-top:6px;padding:6px;background:#f5f5f5;border-radius:6px;font-size:12px;display:none}
.comment-item{margin:3px 0;cursor:pointer;padding:4px 6px;border-radius:4px}
.comment-item:hover{background:#e8e8e8}
.text-moment-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:999;display:none;flex-direction:column;padding:16px}
.cover-preview-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;justify-content:center;align-items:center}
.file-input{display:none}
.plus-menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px}
.plus-menu-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.plus-menu-icon{width:48px;height:48px;border-radius:10px;background:#f5f5f5;display:flex;align-items:center;justify-content:center}
.plus-menu-icon i{font-size:20px;color:#333}
.plus-menu-label{font-size:11px;color:#333}
.redpack-msg{width:200px;background:#e63923;border-radius:8px;color:#fff;padding:12px;cursor:pointer;position:relative;overflow:hidden}
.redpack-msg::after{content:'';position:absolute;bottom:0;left:0;right:0;height:30px;background:rgba(253,216,53,0.7);border-radius:0 0 8px 8px}
.redpack-msg.opened{opacity:0.5;pointer-events:none}
.transfer-msg{width:200px;background:#ffb340;border-radius:8px;color:#fff;padding:12px;cursor:pointer}
.transfer-msg.received{opacity:0.5;pointer-events:none}
.gift-msg{width:200px;background:#1a3a5c;border-radius:8px;color:#d4e6f1;padding:12px;cursor:pointer}
.gift-msg.received{opacity:0.5;pointer-events:none}
.music-msg{width:220px;background:#f7f7f7;border-radius:8px;padding:10px;display:flex;gap:8px}
.modal-mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9996}
.modal-panel{display:none;position:fixed;bottom:0;left:0;width:100%;background:#fff;border-radius:16px 16px 0 0;z-index:9997;padding:16px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-close{font-size:18px;color:#999;cursor:pointer}
.modal-input{width:100%;padding:12px;border:1px solid #eee;border-radius:8px;font-size:14px;outline:none;margin-bottom:12px}
.modal-btn{width:100%;height:44px;border:none;border-radius:8px;font-size:15px;cursor:pointer;color:#fff}
.call-float{display:none;position:fixed;top:80px;right:16px;width:100px;border-radius:12px;z-index:9999;background:#333;cursor:move;overflow:hidden}
.call-float-content{padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff}
.call-float-avatar{width:40px;height:40px;border-radius:50%;background:#666;background-size:cover;background-position:center}
.call-hangup-btn{width:32px;height:32px;border-radius:50%;background:#f53f3f;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.call-minimize-btn{position:absolute;top:6px;right:6px;width:20px;height:20px;background:rgba(255,255,255,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;color:#fff}
.call-min-bar{display:none;position:fixed;top:80px;right:16px;width:180px;height:48px;border-radius:24px;z-index:9999;background:#333;cursor:move;align-items:center;padding:0 12px;gap:8px;color:#fff}
.call-min-avatar{width:32px;height:32px;border-radius:50%;background:#666;flex-shrink:0}
.call-min-time{flex:1;font-size:12px;text-align:center}
.call-min-hangup{width:28px;height:28px;border-radius:50%;background:#f53f3f;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;flex-shrink:0}
</style>
</head>
<body>
<div class="wrapper">
<div id="pageChatDetail" class="page active">
<div class="wx-top-bar">
<div class="wx-left-area">
<div class="wx-back" onclick="showPage('chatList')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></div>
<div class="status-tag">在看海</div>
</div>
<div class="wx-title-wrap"><div class="wx-title" id="noteTitle" onclick="editNote()">爱因</div></div>
<div class="wx-top-right">
<span class="wx-icon" onclick="alert('手机')"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/></svg></span>
<span class="wx-icon" onclick="alert('设置')"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/></svg></span>
</div>
</div>
<div class="chat-area">
<div class="chat-box" id="chatBox"></div>
<div class="emoji-panel" id="emojiPanel">
<div class="emoji-top-tabs"><div class="emoji-top-tab active" data-type="emoji" onclick="switchEmojiTab(this)">emoji</div><div class="emoji-top-tab" data-type="kaomoji" onclick="switchEmojiTab(this)">颜文字</div><div class="emoji-top-tab" data-type="img" onclick="switchEmojiTab(this)">表情包</div></div>
<div class="emoji-content-area"><div class="emoji-grid-emoji" id="emojiGridEmoji"></div><div class="emoji-grid-kaomoji" id="emojiGridKaomoji" style="display:none"></div><div class="emoji-grid-img" id="emojiGridImg" style="display:none"></div></div>
<div class="bottom-bar" id="barKaomoji"><input class="kaomoji-input" id="newKaomojiInput" placeholder="添加颜文字"><button class="add-text-btn" onclick="addKaomojiText()">添加</button></div>
<div class="bottom-bar" id="barImg" style="display:none"><div class="add-sticker-btn" onclick="document.getElementById('fileSticker').click()">+</div><input type="file" id="fileSticker" class="file-input-hide" accept="image/*" multiple onchange="addStickers()"></div>
</div>
<div class="chat-input-wrap">
<div class="btn-voice" onclick="toggleVoice()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg></div>
<input type="text" class="chat-input" id="chatInput" placeholder="输入消息" onkeydown="if(event.key==='Enter')sendMsg()">
<div class="voice-hold-btn" id="voiceHoldBtn" onclick="sendVoice()">按住说话</div>
<div class="btn-face" onclick="toggleEmoji()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg></div>
<div class="btn-more" onclick="showPlusMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
<div class="btn-send" onclick="sendMsg()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></div>
</div>
</div>
</div>

<div id="pageChatList" class="page">
<div style="height:56px;background:#f7f7f9;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:center;position:relative;"><span style="font-size:17px;font-weight:500;">微信</span><span style="position:absolute;right:16px;cursor:pointer;" onclick="showAddMenu()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span></div>
<div class="chat-list-page" id="chatListContainer"></div>
</div>

<div id="pageContact" class="page">
<div style="height:56px;background:#f7f7f9;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:center;"><span style="font-size:17px;font-weight:500;">联系人</span></div>
<div class="contact-page" id="contactList"></div>
</div>

<div id="pageMoment" class="page">
<div style="height:56px;background:#f7f7f9;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:center;"><span style="font-size:17px;font-weight:500;">发现</span></div>
<div class="moment-page"><div class="moment-header" id="momentCover" onclick="previewCover()"><div class="moment-header-top-camera" id="momentHeaderTopCamera" ontouchstart="startPress()" ontouchend="endPress()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div><div class="moment-avatar"></div><div class="moment-name">我</div></div><div class="moment-list" id="momentList"></div></div>
</div>

<div class="tab-bar" id="tabBar">
<div class="tab-item active" data-tab="chatList" onclick="switchTab(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>微信</span></div>
<div class="tab-item" data-tab="contact" onclick="switchTab(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>联系人</span></div>
<div class="tab-item" data-tab="moment" onclick="switchTab(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg><span>朋友圈</span><span class="red-dot" id="momentRedDot"></span></div>
</div>

<div class="text-moment-modal" id="textMomentModal"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><span onclick="closeTextMoment()" style="font-size:15px;color:#666;cursor:pointer;">取消</span><span style="font-size:16px;font-weight:500;">发表文字</span><span onclick="sendTextMoment()" style="font-size:15px;color:#07c160;cursor:pointer;">发表</span></div><textarea id="textMomentText" placeholder="这一刻的想法..." style="flex:1;width:100%;border:none;outline:none;font-size:15px;resize:none;"></textarea></div>
<div class="cover-preview-modal" id="coverPreviewModal" onclick="closeCover()"><img id="coverPreviewImg" style="max-width:90%;max-height:90%;"/><div onclick="changeCover()" style="position:absolute;bottom:40px;right:24px;cursor:pointer;">📷</div></div>
<input type="file" class="file-input" id="fileInputCover" accept="image/*" onchange="setCover()">
<input type="file" class="file-input" id="fileInputMomentPic" accept="image/*" onchange="sendMomentPic()">
<div class="modal-mask" id="modalMask" onclick="closeAllModals()"></div>

<div class="call-min-bar" id="callMinBar"><div class="call-min-avatar" id="callMinAvatar"></div><div class="call-min-time" id="callMinTime">通话中</div><button class="call-min-hangup" onclick="endCall()">📞</button></div>
</div>

<script>

function saveAll(){
try{localStorage.setItem(DATA_KEY,JSON.stringify({avatarConfig:avatarConfig,friends:friends,kaomojiList:kaomojiList,stickerList:stickerList,noteTitle:document.getElementById('noteTitle').innerText,chatHistory:chatHistory,momentItems:momentItems}));}catch(e){}
}
function loadAll(){
try{var d=JSON.parse(localStorage.getItem(DATA_KEY));if(!d)return;if(d.avatarConfig)avatarConfig=d.avatarConfig;if(d.friends)friends=d.friends;if(d.kaomojiList)kaomojiList=d.kaomojiList;if(d.stickerList)stickerList=d.stickerList;if(d.noteTitle)document.getElementById('noteTitle').innerText=d.noteTitle;if(d.chatHistory)chatHistory=d.chatHistory;if(d.momentItems){momentItems=d.momentItems;document.getElementById('momentList').innerHTML='';momentItems.forEach(function(m){addMomentDirect(m.name,m.content);});}}catch(e){}
renderChatList();renderContact();renderKaomoji();renderStickers();renderEmoji();loadChat(currentChatId);
}

function showPage(id){
var pages=document.querySelectorAll('.page');
for(var i=0;i<pages.length;i++){pages[i].classList.remove('active');}
document.getElementById(id).classList.add('active');
document.getElementById('tabBar').style.display=(id==='pageChatDetail')?'none':'flex';
}

function switchTab(el){
var tabs=document.querySelectorAll('.tab-item');
for(var i=0;i<tabs.length;i++){tabs[i].classList.remove('active');}
el.classList.add('active');
showPage('page'+el.dataset.tab.charAt(0).toUpperCase()+el.dataset.tab.slice(1));
if(el.dataset.tab==='moment')document.getElementById('momentRedDot').style.display='none';
}

function editNote(){
var title=document.getElementById('noteTitle');
var old=title.innerText;
var input=document.createElement('input');
input.style.cssText='font-size:16px;border:none;outline:none;text-align:center;width:100px;background:transparent';
input.value=old;
title.innerHTML='';
title.appendChild(input);
input.focus();
input.onblur=function(){title.innerText=input.value||old;saveAll();};
}

function getNowTime(){var d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');}
function getNowMin(){var d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}

function renderEmoji(){var c=document.getElementById('emojiGridEmoji');c.innerHTML='';emojiList.forEach(function(e){var div=document.createElement('div');div.className='emoji-item';div.textContent=e;div.onclick=function(){document.getElementById('chatInput').value+=e;};c.appendChild(div);});}
function renderKaomoji(){var c=document.getElementById('emojiGridKaomoji');c.innerHTML='';kaomojiList.forEach(function(t){var div=document.createElement('div');div.className='emoji-item';div.textContent=t;div.onclick=function(){document.getElementById('chatInput').value+=t;};c.appendChild(div);});}
function renderStickers(){var c=document.getElementById('emojiGridImg');c.innerHTML='';stickerList.forEach(function(src){var wrap=document.createElement('div');wrap.className='img-sticker-item';var img=document.createElement('img');img.src=src;wrap.onclick=function(){addBubble('',true,src);};wrap.appendChild(img);c.appendChild(wrap);});}

function toggleEmoji(){var p=document.getElementById('emojiPanel');p.style.display=(p.style.display==='flex')?'none':'flex';}
function toggleVoice(){var i=document.getElementById('chatInput');var v=document.getElementById('voiceHoldBtn');if(i.style.display==='none'){i.style.display='block';v.style.display='none';}else{i.style.display='none';v.style.display='flex';}}
function sendVoice(){addBubble('🎤语音消息',true);showTyping();setTimeout(function(){addBubble('收到啦🥰',false);},1500);}

function renderChatList(){var c=document.getElementById('chatListContainer');c.innerHTML='';friends.forEach(function(f){var bg=f.avatar?'background-image:url(\''+f.avatar+'\')':'background:#ccc';c.innerHTML+='<div class="chat-list-item" onclick="openChat('+f.id+')"><div class="chat-list-avatar" style="'+bg+'"></div><div class="chat-list-info"><div class="chat-list-name">'+f.name+'</div><div class="chat-list-desc">点击进入聊天</div></div></div>';});}
function openChat(id){var f=friends.find(function(x){return x.id===id;});if(!f)return;document.getElementById('noteTitle').innerText=f.name;avatarConfig.otherAvatar=f.avatar||'';currentChatId=id;showPage('pageChatDetail');loadChat(id);}
function renderContact(){var c=document.getElementById('contactList');c.innerHTML='';friends.forEach(function(f){var bg=f.avatar?'background-image:url(\''+f.avatar+'\')':'background:#ccc';c.innerHTML+='<div class="contact-group"><div class="contact-group-title">朋友</div><div class="contact-item"><div class="contact-avatar" style="'+bg+'"></div><div class="contact-name">'+f.name+'</div></div></div>';});}

function loadChat(friendId){
currentChatId=friendId;
var box=document.getElementById('chatBox');
box.innerHTML='';
lastMsgIsMe=null;lastMsgTime=null;
var msgs=chatHistory[friendId]||[];
msgs.forEach(function(m){addBubbleDirect(m.text,m.isMe,m.imgSrc,m.time);});
}

function addBubbleDirect(text,isMe,imgSrc,time){
var showAvatar=(lastMsgIsMe!==isMe);lastMsgIsMe=isMe;
var row=document.createElement('div');row.className='msg-row '+(isMe?'msg-row-right':'msg-row-left');
var avatar=document.createElement('div');avatar.className='msg-avatar '+(showAvatar?'':'msg-avatar-hidden');
var av=(isMe?avatarConfig.myAvatar:avatarConfig.otherAvatar);
avatar.style.background=av?'url('+av+')':'#ccc';
avatar.style.backgroundSize='cover';avatar.style.backgroundPosition='center';
avatar.onclick=function(){changeAvatar(isMe);};
var content=document.createElement('div');content.className='msg-content';
var bubble=document.createElement('div');bubble.className='msg-bubble';
if(imgSrc){var img=document.createElement('img');img.src=imgSrc;img.style.cssText='max-width:160px;border-radius:10px;display:block;';bubble.appendChild(img);}else{bubble.innerText=text;}
if(isMe){bubble.innerHTML+='<span class="read-mark">已读</span>';}
var status=document.createElement('div');status.className='msg-status';status.innerText=time||getNowTime();
content.appendChild(bubble);content.appendChild(status);
if(isMe){row.appendChild(content);row.appendChild(avatar);}else{row.appendChild(avatar);row.appendChild(content);}
document.getElementById('chatBox').appendChild(row);
}

function addMomentDirect(name,content){
var div=document.createElement('div');div.className='moment-item';
div.innerHTML='<div class="moment-avatar-small"></div><div class="moment-name-small">'+name+'</div><div class="moment-time">刚刚</div><div class="moment-text">'+content+'</div><div class="moment-actions"><button class="action-btn" onclick="toggleLike(this)"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> 点赞</button><button class="action-btn" onclick="commentMoment(this)"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> 评论</button></div><div class="like-list"></div><div class="comment-box"></div>';
document.getElementById('momentList').appendChild(div);
}

function checkTime(){var m=getNowMin();if(lastMsgTime&&lastMsgTime!==m){var div=document.createElement('div');div.className='msg-time-divider';div.innerText=m;document.getElementById('chatBox').appendChild(div);}lastMsgTime=m;}
function showTyping(){var title=document.getElementById('noteTitle');var old=title.innerText;title.innerText='输入中...';setTimeout(function(){title.innerText=old;},2000);}

function addBubble(text,isMe,imgSrc){
checkTime();
var time=getNowTime();
addBubbleDirect(text,isMe,imgSrc,time);
if(!chatHistory[currentChatId])chatHistory[currentChatId]=[];
chatHistory[currentChatId].push({text:text,isMe:isMe,imgSrc:imgSrc||null,time:time});
saveAll();
}

function sendMsg(){var text=document.getElementById('chatInput').value.trim();if(!text)return;addBubble(text,true);document.getElementById('chatInput').value='';showTyping();setTimeout(function(){if(Math.random()<0.1){addBubble('对方撤回了一条消息',false);}else{addBubble('收到啦🥰',false);}},1500);}

function changeAvatar(isMe){var input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=function(e){var f=e.target.files[0];if(f){var r=new FileReader();r.onload=function(ev){if(isMe){avatarConfig.myAvatar=ev.target.result;}else{avatarConfig.otherAvatar=ev.target.result;var f0=friends.find(function(x){return x.id===currentChatId;});if(f0)f0.avatar=ev.target.result;}saveAll();renderChatList();renderContact();alert('头像已更换！');};r.readAsDataURL(f);}};input.click();}

function addRedpack(money,remark){
var row=document.createElement('div');row.className='msg-row msg-row-right';
row.innerHTML='<div class="msg-content"><div class="msg-bubble msg-right"><div class="redpack-msg" data-opened="0" onclick="openRedpacket(this,\''+money+'\',\''+remark+'\')"><div style="font-size:18px;font-weight:500;">¥'+money+'</div><div style="font-size:12px;opacity:0.9;margin-top:4px;">'+remark+'</div></div></div><div class="msg-status">'+getNowTime()+'</div></div><div class="msg-avatar" style="background:'+(avatarConfig.myAvatar?'url('+avatarConfig.myAvatar+')':'#ccc')+';background-size:cover"></div>';
document.getElementById('chatBox').appendChild(row);document.getElementById('chatBox').scrollTop=document.getElementById('chatBox').scrollHeight;
if(!chatHistory[currentChatId])chatHistory[currentChatId]=[];
chatHistory[currentChatId].push({text:'[红包]¥'+money,isMe:true,imgSrc:null,time:getNowTime()});saveAll();
}
function openRedpacket(el,money,remark){
if(el.dataset.opened==='1')return;el.dataset.opened='1';
var modal=document.createElement('div');modal.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;';
modal.innerHTML='<div style="width:260px;background:#e63923;border-radius:14px;text-align:center;overflow:hidden;position:relative;"><div style="padding:24px 16px;background:linear-gradient(180deg,#f5553c,#e63923);"><div style="color:#fdd835;font-size:13px;">'+remark+'</div><div style="width:70px;height:70px;border-radius:50%;background:#fdd835;margin:16px auto;display:flex;align-items:center;justify-content:center;font-size:24px;color:#e63923;font-weight:bold;cursor:pointer;" onclick="receiveRedpack(this,\''+money+'\')">開</div><div style="color:#fff;font-size:11px;">爱因的红包</div></div><div style="height:50px;background:transparent;position:relative;"><div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:20px solid #fdd835;"></div><div style="position:absolute;top:15px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#fdd835;"></div></div><div style="background:#fff;padding:12px;font-size:13px;color:#999;" onclick="this.closest(\'div[style]\').remove()">关闭</div></div>';
document.body.appendChild(modal);
modal.onclick=function(e){if(e.target===modal)modal.remove();};
el.classList.add('opened');saveAll();
}
function receiveRedpack(btn,money){btn.parentElement.innerHTML='<div style="color:#fdd835;font-size:13px;">已领取</div><div style="color:#fff;font-size:32px;font-weight:bold;margin:8px 0;">¥'+money+'</div><div style="color:#fdd835;font-size:11px;">已存入零钱</div>';}

function addTransfer(money,remark){
var row=document.createElement('div');row.className='msg-row msg-row-right';
row.innerHTML='<div class="msg-content"><div class="msg-bubble msg-right"><div class="transfer-msg" data-received="0" onclick="confirmTransfer(this,\''+money+'\')"><div style="font-size:18px;font-weight:500;">¥'+money+'</div><div style="font-size:12px;margin-top:4px;">'+(remark||'转账')+'</div></div></div><div class="msg-status">'+getNowTime()+'</div></div><div class="msg-avatar" style="background:'+(avatarConfig.myAvatar?'url('+avatarConfig.myAvatar+')':'#ccc')+';background-size:cover"></div>';

if(!chatHistory[currentChatId])chatHistory[currentChatId]=[];
chatHistory[currentChatId].push({text:'[转账]¥'+money,isMe:true,imgSrc:null,time:getNowTime()});saveAll();

function confirmTransfer(el,money){
if(el.dataset.received==='1')return;el.dataset.received='1';
el.querySelector('div:last-child').innerText='已收款';el.classList.add('received');
var tip=document.createElement('div');tip.className='msg-time-divider';tip.innerText='爱因已收款 ¥'+money;
document.getElementById('chatBox').appendChild(tip);document.getElementById('chatBox').scrollTop=document.getElementById('chatBox').scrollHeight;saveAll();
}

function startCall(){
var cf=document.getElementById('callFloat');cf.style.display='block';document.getElementById('callStatus').textContent='呼叫中...';
setTimeout(function(){
var r=Math.random();
if(r<0.3){document.getElementById('callStatus').textContent='对方正在忙';}
else if(r<0.6){document.getElementById('callStatus').textContent='对方无法接听';}
else if(r<0.8){document.getElementById('callStatus').textContent='对方不在';}
else{document.getElementById('callStatus').textContent='通话中';}
setTimeout(function(){cf.style.display='none';addSystemTip('通话结束');},3000);
},2000);
}
function endCall(){document.getElementById('callFloat').style.display='none';document.getElementById('callMinBar').style.display='none';addSystemTip('通话结束');}
function minimizeCall(){document.getElementById('callFloat').style.display='none';document.getElementById('callMinBar').style.display='flex';}

function startPress(){pressTimer=setTimeout(function(){document.getElementById('textMomentModal').style.display='flex';},600);}
function endPress(){clearTimeout(pressTimer);document.getElementById('fileInputMomentPic').click();}
function sendMomentPic(){var f=document.getElementById('fileInputMomentPic').files[0];if(f){addMoment('我','<img src="'+URL.createObjectURL(f)+'" style="max-width:100%;border-radius:8px;margin-top:6px">');}}
function closeTextMoment(){document.getElementById('textMomentModal').style.display='none';}
function sendTextMoment(){var v=document.getElementById('textMomentText').value.trim();if(v){addMoment('我',v);document.getElementById('textMomentModal').style.display='none';document.getElementById('textMomentText').value='';}}

function addMoment(name,content){
addMomentDirect(name,content);
momentItems.push({name:name,content:content});
saveAll();
if(Math.random()<0.6){setTimeout(function(){var items=document.querySelectorAll('.moment-item');if(items.length>0){var cb=items[0].querySelector('.comment-box');cb.style.display='block';cb.innerHTML='<div class="comment-item" onclick="replyTo(this)"><strong>爱因</strong>：'+kaomojiList[Math.floor(Math.random()*kaomojiList.length)]+'</div>';document.getElementById('momentRedDot').style.display='block';}},2000);}
if(Math.random()<0.3){setTimeout(function(){addMoment('爱因',kaomojiList[Math.floor(Math.random()*kaomojiList.length)]);document.getElementById('momentRedDot').style.display='block';},5000);}
}

function toggleLike(btn){btn.classList.toggle('liked');var ll=btn.closest('.moment-item').querySelector('.like-list');if(btn.classList.contains('liked')){ll.style.display='block';ll.innerText='我 赞了';}else{ll.style.display='none';ll.innerText='';}}
function commentMoment(btn){var cb=btn.closest('.moment-item').querySelector('.comment-box');cb.style.display='block';if(cb.querySelector('input'))return;var input=document.createElement('input');input.style.cssText='width:100%;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:12px;margin-top:4px;';input.placeholder='写评论...';input.onkeydown=function(e){if(e.key==='Enter'&&input.value.trim()){cb.innerHTML+='<div class="comment-item"><strong>我</strong>：'+input.value+'</div>';input.remove();}};cb.appendChild(input);input.focus();}
function replyTo(el){var cb=el.closest('.comment-box');if(cb.querySelector('input'))return;var input=document.createElement('input');input.style.cssText='width:100%;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:12px;margin-top:4px;';input.placeholder='回复...';input.onkeydown=function(e){if(e.key==='Enter'&&input.value.trim()){cb.innerHTML+='<div class="comment-item"><strong>我</strong>：'+input.value+'</div>';input.remove();}};cb.appendChild(input);input.focus();}

function previewCover(){var bg=getComputedStyle(document.getElementById('momentCover')).backgroundImage;var match=bg.match(/url\("?(.*?)"?\)/);document.getElementById('coverPreviewImg').src=match?match[1]:'';document.getElementById('coverPreviewModal').style.display='flex';}
function closeCover(){document.getElementById('coverPreviewModal').style.display='none';}
function changeCover(){document.getElementById('fileInputCover').click();}
function setCover(){var f=document.getElementById('fileInputCover').files[0];if(f){document.getElementById('momentCover').style.backgroundImage='url('+URL.createObjectURL(f)+')';closeCover();}}

// 初始化
showPage('pageChatDetail');
loadAll();
</script>
</body>
